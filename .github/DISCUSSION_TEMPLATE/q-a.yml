body:
  - type: markdown
    attributes:
      value: |
        Спершу перегляньте [посібник](https://github.com/DenisHumen/kinolune/tree/main/docs/user) і схожі обговорення. Не публікуйте паролі, токени, приватні посилання та повні шляхи до файлів.
        Check the [user guide](https://github.com/DenisHumen/kinolune/tree/main/docs/user) and similar discussions first. Never post passwords, tokens, private links or full file paths.
        Сначала посмотрите [руководство](https://github.com/DenisHumen/kinolune/tree/main/docs/user) и похожие обсуждения. Не публикуйте пароли, токены, приватные ссылки и полные пути к файлам.
  - type: textarea
    id: question
    attributes:
      label: Питання / Question / Вопрос
      description: Що ви хочете зробити і де зупинилися? / What are you trying to do, and where are you stuck? / Что вы хотите сделать и где остановились?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версія та платформа / Version and platform / Версия и платформа
      placeholder: "0.1.0-alpha · Linux (Wayland)"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Що вже спробували / What you tried / Что уже пробовали
    validations:
      required: false
