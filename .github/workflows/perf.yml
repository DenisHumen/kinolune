# SPDX-License-Identifier: MPL-2.0
#
# QA-006: UI performance budgets on Linux desktop under Xvfb (software
# rendering on a shared runner). Informational, never gating: the job does
# not fail on a regression, it adds `::warning` annotations to the PR and a
# table to the job summary when a tracked number is more than 20 % worse
# than perf/baseline/linux-ci.json (docs/dev/performance.md). Not part of
# flutter-green.
#
# Safe for PRs from forks: `pull_request` only, read-only token, no secrets,
# every third-party action pinned to a full commit SHA.

name: Perf

on:
  pull_request:
    # Like flutter.yml: once when the PR is opened or marked ready.
    types: [opened, reopened, ready_for_review]
    paths:
      - "clients/flutter/**"
      - "design/flutter/**"
      - "core/crates/pa-library/**"
      - "core/crates/pa-frb/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with flutter.yml.
  FLUTTER_VERSION: "3.50.0"
  APP_DIR: clients/flutter/app

jobs:
  linux-xvfb:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: UI perf (Linux, Xvfb, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libsecret-1-dev xvfb xauth libgl1-mesa-dri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: node design/scripts/fonts-fetch.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Scenarios and cold start
        working-directory: ${{ env.APP_DIR }}
        # A runner hiccup must not turn the PR red: the step never fails
        # the job; regressions are annotations.
        continue-on-error: true
        run: |
          flutter pub get
          baseline=perf/baseline/linux-ci.json
          args=(--core --runs 5 --github)
          [ -f "$baseline" ] && args+=(--baseline "$baseline")
          tool/perf_bench.sh linux "${args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-linux-xvfb
          path: |
            ${{ env.APP_DIR }}/build/perf/*.json
            ${{ env.APP_DIR }}/build/perf/*.md
            ${{ env.APP_DIR }}/build/perf/*.log
          if-no-files-found: ignore
          retention-days: 14
