# SPDX-License-Identifier: MPL-2.0
#
# LGPL-2.1+ libmpv (PLAY-002): mpv -Dgpl=false + libplacebo + libass on top of
# our LGPL FFmpeg (tools/ffmpeg), for Linux, Windows, Android (3 ABIs) and macOS.
# Runs the licence gate on every artifact and uploads the result. A build is
# named by the hash of both recipes plus the toolchain (tools/ci/prebuilt.sh,
# ADR-0119) and taken from actions/cache or the release `prebuilt` when it
# exists, so unchanged recipes only re-check licences. prebuilt.yml calls this
# on main with `publish` to fill that release.
name: libmpv (LGPL)

on:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "tools/mpv/**"
      - "tools/ffmpeg/**"
      # Inputs of the subtitle golden frames (tools/mpv/tests/subtitles).
      - "tools/qa/media/pgs.py"
      - "tools/qa/media/texts.py"
      - "tools/ci/prebuilt.sh"
      - ".github/workflows/libmpv.yml"
  workflow_dispatch:
  # release-app.yml (PLAY-013): the app bundles these artifacts. `release`
  # builds only what the app ships (Linux x86_64, Windows x86_64, Android
  # ABIs, macOS arm64 and x86_64, sources); `apple_only` skips Linux, Windows
  # and Android (macOS-only dry runs of the app, PKG-019); `windows_only`
  # builds only Windows x86_64 and the sources (Windows-only dry runs, PKG-020).
  # prebuilt.yml (CI-008): `publish` also uploads every new build (and the
  # sources) as `prebuilt-*` workflow artifacts for the release `prebuilt`.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      apple_only:
        type: boolean
        default: false
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # As a called workflow, github.workflow is the caller's name: no clash.
  group: libmpv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_NDK_PACKAGE: "ndk;28.2.13676358" # r28c
  MESON_VERSION: "1.10.2"
  NINJA_VERSION: "1.11.1.4"

jobs:
  sources:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Sources and GPL canary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache source tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/.cache
          key: libmpv-src-${{ hashFiles('tools/ffmpeg/versions.sh', 'tools/mpv/versions.sh') }}
      - name: Download and verify pinned sources
        run: tools/mpv/build.sh fetch
      - name: GPL options must fail the build
        run: |
          # mpv options: -Dgpl=true and GPL-only features.
          for flag in -Dgpl=true -Dx11=enabled -Ddvdnav=enabled -Drubberband=enabled -Djack=enabled; do
            if out="$(PA_MPV_EXTRA_FLAGS="$flag" tools/mpv/build.sh linux-x86_64 2>&1)"; then
              echo "::error::build accepted $flag"; exit 1
            fi
            printf '%s\n' "$out" | grep -q 'forbidden (GPL) mpv option' \
              || { printf '%s\n' "$out"; echo "::error::$flag failed for the wrong reason"; exit 1; }
            echo "rejected: $flag"
          done
          # The bundled FFmpeg goes through the same gate as tools/ffmpeg.
          if out="$(PA_FF_EXTRA_FLAGS=--enable-gpl tools/mpv/build.sh linux-x86_64 2>&1)"; then
            echo "::error::build accepted FFmpeg --enable-gpl"; exit 1
          fi
          printf '%s\n' "$out" | grep -q 'forbidden (GPL/nonfree/v3) FFmpeg option' \
            || { printf '%s\n' "$out"; echo "::error::--enable-gpl failed for the wrong reason"; exit 1; }
          echo "rejected: FFmpeg --enable-gpl"
      - name: Licence gate rejects a GPL config.h
        run: |
          d="$RUNNER_TEMP/fake-gpl"; mkdir -p "$d"
          printf '%s\n' '#define CONFIGURATION "-Dgpl=true"' '#define FULLCONFIG "ffmpeg gpl libass x11"' \
            '#define HAVE_GPL 1' '#define HAVE_X11 1' > "$d/config.h"
          if tools/mpv/check-license.sh --config "$d"; then echo "::error::GPL config.h passed"; exit 1; fi
      - name: Corresponding-source bundle
        run: tools/mpv/build.sh sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-sources
          path: tools/mpv/out/project_alpha-libmpv-sources-*.tar.xz
          retention-days: 7
          if-no-files-found: error
      - name: Sources for the release `prebuilt` (LGPL §6)
        if: ${{ inputs.publish }}
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt"
          cp tools/mpv/out/project_alpha-libmpv-sources-*.tar.xz \
            "$RUNNER_TEMP/prebuilt/libmpv-sources-$(tools/ci/prebuilt.sh recipe libmpv).tar.xz"
      - if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-libmpv-sources
          path: ${{ runner.temp }}/prebuilt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  docker:
    if: ${{ !inputs.apple_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.target }}
    needs: sources
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.windows_only && '["windows-x86_64"]' || '["linux-x86_64","windows-x86_64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt key (recipe + toolchain)
        id: key
        run: echo "key=$(tools/ci/prebuilt.sh key libmpv "$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Cache build output
        id: out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/out/${{ matrix.target }}
          key: prebuilt-${{ steps.key.outputs.key }}
      - name: Prebuilt from the release
        id: rel
        if: steps.out.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          # Anything but a clean download (not published, network) builds instead.
          if tools/ci/prebuilt.sh fetch "$KEY" "tools/mpv/out/$TARGET"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore source tarballs
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/.cache
          key: libmpv-src-${{ hashFiles('tools/ffmpeg/versions.sh', 'tools/mpv/versions.sh') }}
          fail-on-cache-miss: true
      - name: Build
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        run: PA_FF_JOBS="$(nproc)" tools/mpv/docker-build.sh "${TARGET}"
      - name: Licence check
        run: tools/mpv/check-license.sh --artifact "tools/mpv/out/${TARGET}"
      - name: Runtime check (mpv_client_api_version)
        if: matrix.target == 'linux-x86_64'
        run: |
          # The build already ran it inside the image; repeat it on the runner
          # with the runner's own system libraries (libva, libpulse, ...).
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libva2 libva-drm2 libdrm2 libegl1 libpulse0 libasound2t64
          tools/mpv/check-license.sh --run "tools/mpv/out/${TARGET}"
          ldd "tools/mpv/out/${TARGET}/lib/libmpv.so"
      - name: Subtitle golden frames (ASS, PGS, VobSub)
        if: matrix.target == 'linux-x86_64'
        run: |
          # PLAY-006: libmpv's software renderer against testdata/golden. The
          # distribution ffmpeg only makes the test inputs; it is not shipped.
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core libfontconfig1
          python3 tools/mpv/tests/subtitles/media.py "$RUNNER_TEMP/subs-media"
          python3 tools/mpv/tests/subtitles/golden.py --lib "tools/mpv/out/${TARGET}/lib/libmpv.so.2" \
            --media "$RUNNER_TEMP/subs-media" --out "$RUNNER_TEMP/subs-out"
      - name: Upload subtitle frames on failure
        if: failure() && matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subtitle-golden-diff
          path: ${{ runner.temp }}/subs-out
          retention-days: 7
          if-no-files-found: ignore
      - name: Where the build came from
        env:
          KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.out.outputs.cache-hit }}
          REL_HIT: ${{ steps.rel.outputs.hit }}
        run: |
          src=build; [ "$REL_HIT" = true ] && src="release prebuilt"; [ "$CACHE_HIT" = true ] && src=actions/cache
          echo "$KEY: $src" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack for the release `prebuilt`
        if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: tools/ci/prebuilt.sh pack "$KEY" "tools/mpv/out/$TARGET" "$RUNNER_TEMP/prebuilt"
      - if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/prebuilt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-${{ matrix.target }}
          path: tools/mpv/out/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  android:
    if: ${{ !inputs.apple_only && !inputs.windows_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.target }}
    needs: sources
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64-v8a, android-armeabi-v7a, android-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt key (recipe + toolchain)
        id: key
        run: echo "key=$(tools/ci/prebuilt.sh key libmpv "$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Cache build output
        id: out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/out/${{ matrix.target }}
          key: prebuilt-${{ steps.key.outputs.key }}
      - name: Prebuilt from the release
        id: rel
        if: steps.out.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          # Anything but a clean download (not published, network) builds instead.
          if tools/ci/prebuilt.sh fetch "$KEY" "tools/mpv/out/$TARGET"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore source tarballs
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/.cache
          key: libmpv-src-${{ hashFiles('tools/ffmpeg/versions.sh', 'tools/mpv/versions.sh') }}
          fail-on-cache-miss: true
      - name: Install toolchain
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nasm pkg-config
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          # sdkmanager verifies the package checksum from Google's repository.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_NDK_PACKAGE" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/${ANDROID_NDK_PACKAGE/;//}" >> "$GITHUB_ENV"
      - name: Build
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        run: PA_FF_JOBS="$(nproc)" tools/mpv/build.sh "${TARGET}"
      - name: Licence check
        run: tools/mpv/check-license.sh --artifact "tools/mpv/out/${TARGET}"
      - name: Android packaging check (unversioned SONAMEs, 16 KB pages)
        run: tools/mpv/bundle.sh check-android "tools/mpv/out/${TARGET}"
      - name: Where the build came from
        env:
          KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.out.outputs.cache-hit }}
          REL_HIT: ${{ steps.rel.outputs.hit }}
        run: |
          src=build; [ "$REL_HIT" = true ] && src="release prebuilt"; [ "$CACHE_HIT" = true ] && src=actions/cache
          echo "$KEY: $src" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack for the release `prebuilt`
        if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: tools/ci/prebuilt.sh pack "$KEY" "tools/mpv/out/$TARGET" "$RUNNER_TEMP/prebuilt"
      - if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/prebuilt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-${{ matrix.target }}
          path: tools/mpv/out/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  apple:
    name: ${{ matrix.target }}
    needs: sources
    # Also in release builds: the macOS app ships both slices (PKG-019).
    if: ${{ !inputs.windows_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: macos-15
    env:
      TARGET: ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt key (recipe + toolchain)
        id: key
        run: echo "key=$(tools/ci/prebuilt.sh key libmpv "$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Cache build output
        id: out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/out/${{ matrix.target }}
          key: prebuilt-${{ steps.key.outputs.key }}
      - name: Prebuilt from the release
        id: rel
        if: steps.out.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          # Anything but a clean download (not published, network) builds instead.
          if tools/ci/prebuilt.sh fetch "$KEY" "tools/mpv/out/$TARGET"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install nasm pkgconf
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Restore source tarballs
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/.cache
          key: libmpv-src-${{ hashFiles('tools/ffmpeg/versions.sh', 'tools/mpv/versions.sh') }}
          fail-on-cache-miss: true
      - name: Build
        if: steps.out.outputs.cache-hit != 'true' && steps.rel.outputs.hit != 'true'
        run: PA_FF_JOBS="$(sysctl -n hw.ncpu)" tools/mpv/build.sh "${TARGET}"
      - name: Licence check
        run: tools/mpv/check-license.sh --artifact "tools/mpv/out/${TARGET}"
      - name: Runtime check (mpv_client_api_version)
        if: matrix.target == 'macos-arm64'
        run: tools/mpv/check-license.sh --run "tools/mpv/out/${TARGET}"
      - name: Where the build came from
        env:
          KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.out.outputs.cache-hit }}
          REL_HIT: ${{ steps.rel.outputs.hit }}
        run: |
          src=build; [ "$REL_HIT" = true ] && src="release prebuilt"; [ "$CACHE_HIT" = true ] && src=actions/cache
          echo "$KEY: $src" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack for the release `prebuilt`
        if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: tools/ci/prebuilt.sh pack "$KEY" "tools/mpv/out/$TARGET" "$RUNNER_TEMP/prebuilt"
      - if: ${{ inputs.publish && steps.rel.outputs.hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/prebuilt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-${{ matrix.target }}
          path: tools/mpv/out/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
