# SPDX-License-Identifier: MPL-2.0
#
# Release of the Flutter app (R01-REL): Linux x86_64 (tar.gz + AppImage,
# .deb and .rpm with the APT/DNF repository: PKG-002, PKG-023),
# Android APKs (arm64-v8a, armeabi-v7a, x86_64 + universal), a macOS
# universal app (zip, ad-hoc signed, not notarized: PKG-019) and a portable
# Windows x64 zip (not code-signed: PKG-020, signing is PKG-005), SHA256SUMS,
# licence notices and LGPL corresponding sources, published as a GitHub Release.
# Both platforms ship our LGPL-2.1 libmpv + FFmpeg (tools/mpv, PLAY-013), built
# in the same run by libmpv.yml, and LGPL-2.1 libsmb2 for SMB sources
# (tools/libsmb2, LIB-019), built in the same run by libsmb2.yml. A build
# without either fails.
#
#   - push of a tag `app-v<semver>`     -> build, then publish the release;
#   - workflow_dispatch with `version`  -> dry run: same build, everything is
#     uploaded as the workflow artifact `release-<version>`, nothing is published.
#     `platforms: macos` builds only the macOS app (artifacts `macos` and
#     `macos-smoke` with playback screenshots and the
#     PKG-021 audio-device logs); `platforms: windows` only the
#     Windows app (`windows`, `windows-smoke`); `platforms: linux` only the
#     Linux app and its AppImage update test (PKG-024); no release assembly.
#
# After a published release, `linux-repo` starts linux-repo.yml on main,
# which rebuilds the signed APT/DNF repositories on GitHub Pages (PKG-023).
#
# Only the `publish` job gets `contents: write`. Android signing uses the
# repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD when present; otherwise the
# APKs keep the debug signature and the release is labelled so.
# Owner steps: packaging/app/README.md.

name: Release app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run (semver, e.g. 0.1.0-rc.1). Nothing is published."
        required: true
        default: "0.0.0-dryrun"
      platforms:
        description: "What to build in the dry run."
        type: choice
        options: [all, macos, windows, linux]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with flutter.yml.
  FLUTTER_VERSION: "3.50.0"
  APP_DIR: clients/flutter/app
  # GitHub Releases ship the full flavor (ADR-0007, CORE-013): Dart through
  # --dart-define, the Rust core through the pa_core build hook. Store
  # builds: flavors.yml.
  KINOLUNE_FLAVOR: full
  CARGO_KINOLUNE_FLAVOR: full

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      platforms: ${{ steps.v.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Only a tag publishes; anything else (workflow_dispatch) is a dry run.
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == app-v* ]]; then
            tag="$REF_NAME"; version="${REF_NAME#app-v}"; dry_run=false; platforms=all
          else
            version="${INPUT_VERSION:-0.0.0-dryrun}"; tag="app-v$version"; dry_run=true
            platforms="${INPUT_PLATFORMS:-all}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a semver version (x.y.z or x.y.z-pre)"
            exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          if [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "::error::$APP_DIR/pubspec.yaml not found: the app is not on this ref"
            exit 1
          fi
          {
            echo "version=$version"; echo "tag=$tag"
            echo "dry_run=$dry_run"; echo "prerelease=$prerelease"; echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"
          echo "### Kinolune $version (dry run: $dry_run, prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  libmpv:
    name: libmpv
    needs: meta
    uses: ./.github/workflows/libmpv.yml
    with:
      release: true
      apple_only: ${{ needs.meta.outputs.platforms == 'macos' }}
      windows_only: ${{ needs.meta.outputs.platforms == 'windows' }}
      linux_only: ${{ needs.meta.outputs.platforms == 'linux' }}

  libsmb2:
    name: libsmb2
    needs: meta
    uses: ./.github/workflows/libsmb2.yml
    with:
      release: true
      apple_only: ${{ needs.meta.outputs.platforms == 'macos' }}
      windows_only: ${{ needs.meta.outputs.platforms == 'windows' }}
      linux_only: ${{ needs.meta.outputs.platforms == 'linux' }}

  linux:
    name: Linux x86_64
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            patchelf libva2 libva-drm2 libdrm2 libegl1 libpulse0 libasound2t64
          # No libmpv-dev: the app links our libmpv (tools/mpv) through its .pc files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-linux-x86_64
          path: ${{ runner.temp }}/libmpv-linux-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-linux-x86_64
          path: ${{ runner.temp }}/libsmb2-linux-x86_64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # No cache in the release pipeline: every release builds from scratch.
          cache: false
      - name: Rust toolchain for the core (pa_core Native Assets, UI-024)
        working-directory: core/crates/pa-frb
        # Channel and targets (Linux, Android) from the crate's rust-toolchain.toml;
        # the pa_core build hook compiles libpa_frb into the app with it.
        run: rustup toolchain install
      - name: Bundled anime database (META-030, ODbL)
        # Pinned anime-offline-database release (SHA-256 checked), derived
        # bundle + upstream LICENSE into the app assets (~3 MB, zstd).
        run: |
          rustup toolchain install
          data/anime-mappings/build.sh "$RUNNER_TEMP/anime-db"
          install -m 644 "$RUNNER_TEMP/anime-db/anime-offline-ids.jsonl.zst" \
            "$RUNNER_TEMP/anime-db/LICENSE.anime-offline-database" "$APP_DIR/assets/anime-db/"
      - name: flutter build linux
        working-directory: ${{ env.APP_DIR }}
        env:
          # Project TMDB key (DEC-008), baked into the Rust core; the build
          # hook passes only CARGO_* through (pa-metadata key.rs).
          CARGO_PA_TMDB_API_KEY: ${{ secrets.PA_TMDB_API_KEY }}
          # Project OpenSubtitles consumer key (PLAY-008), baked into the core
          # the same way; without it users enter their own key in Settings.
          CARGO_PA_OPENSUBTITLES_API_KEY: ${{ secrets.PA_OPENSUBTITLES_API_KEY }}
          # Fanart.tv project key (META-012): clear logos and clear art;
          # without it only users with a personal key in Settings get them.
          CARGO_PA_FANART_API_KEY: ${{ secrets.PA_FANART_API_KEY }}
          # Public OAuth client ids of the clouds (NET-017) and the MEGA app
          # key, baked into the core; empty: users enter their own client id.
          CARGO_PA_GDRIVE_CLIENT_ID: ${{ secrets.PA_GDRIVE_CLIENT_ID }}
          CARGO_PA_GDRIVE_CLIENT_SECRET: ${{ secrets.PA_GDRIVE_CLIENT_SECRET }}
          CARGO_PA_ONEDRIVE_CLIENT_ID: ${{ secrets.PA_ONEDRIVE_CLIENT_ID }}
          CARGO_PA_DROPBOX_CLIENT_ID: ${{ secrets.PA_DROPBOX_CLIENT_ID }}
          CARGO_PA_MEGA_APP_KEY: ${{ secrets.PA_MEGA_APP_KEY }}
          # Public Twitch client id (TWI-013), owner-registered app; a secret
          # only so it stays out of git (DEC-006).
          KINOLUNE_TWITCH_CLIENT_ID: ${{ secrets.KINOLUNE_TWITCH_CLIENT_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # media_kit_video finds libmpv with pkg-config: ours, never the system one.
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libmpv-linux-x86_64/lib/pkgconfig"
          pkg-config --modversion mpv
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter build linux --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=KINOLUNE_VERSION="$VERSION" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" --dart-define=KINOLUNE_TWITCH_CLIENT_ID="$KINOLUNE_TWITCH_CLIENT_ID"
      - name: Package tar.gz and AppImage (with our libmpv and libsmb2)
        env:
          PA_LIBMPV_DIR: ${{ runner.temp }}/libmpv-linux-x86_64
          PA_LIBSMB2_DIR: ${{ runner.temp }}/libsmb2-linux-x86_64
        run: packaging/app/linux/package.sh "$APP_DIR/build/linux/x64/release/bundle" "$VERSION" dist
      - name: Package .deb and .rpm (PKG-002; nfpm pinned by SHA-256)
        # From the tar.gz just written: /opt/kinolune, /usr/bin/kinolune, the
        # .desktop file, package-type, and the APT/DNF repository on first
        # install. The rpm is signed in `assemble`, the only job with the key.
        run: packaging/linux/build-packages.sh "dist/kinolune-$VERSION-linux-x86_64.tar.gz" "$VERSION" dist
      - name: Smoke-test the bundle links
        run: |
          tar -xzf "dist/kinolune-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/kinolune-$VERSION-linux-x86_64"
          exe=$(find "$dir" -maxdepth 1 -type f -perm -u+x | head -n1)
          if ldd "$exe" "$dir"/lib/*.so* | grep 'not found'; then
            echo "::error::unresolved shared libraries"; exit 1
          fi
          # The plugin must resolve libmpv from the bundle (RUNPATH=$ORIGIN).
          ldd "$dir/lib/libmedia_kit_video_plugin.so" | grep -F "libmpv.so.2 => $dir/lib/libmpv.so.2" \
            || { echo "::error::media_kit_video does not load the bundled libmpv"; exit 1; }
          [ -f "$dir/licenses/libmpv/BUILDINFO.txt" ] || { echo "::error::libmpv licences missing"; exit 1; }
          # SMB sources (LIB-019): pa-smb2 opens lib/libsmb2.so.1 next to the
          # executable; it must load and export what pa-smb2 calls.
          [ -f "$dir/lib/libsmb2.so.1" ] || { echo "::error::libsmb2.so.1 missing from the bundle"; exit 1; }
          python3 -I -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1]).smb2_init_context' "$dir/lib/libsmb2.so.1" \
            || { echo "::error::bundled libsmb2.so.1 does not load"; exit 1; }
          [ -f "$dir/licenses/libsmb2/BUILDINFO.txt" ] && [ -f "$dir/licenses/libsmb2/libsmb2-COPYING" ] \
            || { echo "::error::libsmb2 licences missing"; exit 1; }
          if nm -D --defined-only "$dir/lib/libpa_frb.so" | grep -q ' smb2_'; then
            echo "::error::libpa_frb.so defines smb2_* (libsmb2 linked in)"; exit 1
          fi
          # The library runs on the Rust core (UI-024): libpa_frb must be bundled.
          [ -f "$dir/lib/libpa_frb.so" ] || { echo "::error::libpa_frb.so (Rust core) missing"; exit 1; }
          # The core is the full flavor (CORE-013).
          tools/flavor/check-artifacts.sh full "$dir/lib/libpa_frb.so"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APKs
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
      libmpv: ${{ steps.licences.outputs.libmpv }}
      libsmb2: ${{ steps.licences.outputs.libsmb2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-android-*
          path: ${{ runner.temp }}/libmpv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libsmb2-android-*
          path: ${{ runner.temp }}/libsmb2
      - name: Our libmpv into jniLibs (PLAY-013)
        run: |
          # The app overrides media_kit_libs_android_video with
          # clients/flutter/packages/media_kit_libs_android_video, whose release
          # build fails without this set; bundle.sh checks it first.
          tools/mpv/bundle.sh android \
            clients/flutter/packages/media_kit_libs_android_video/android/src/main/jniLibs \
            "$RUNNER_TEMP"/libmpv/libmpv-android-{arm64-v8a,armeabi-v7a,x86_64}
      - name: Our libsmb2 into jniLibs (LIB-019)
        run: |
          # Same jniLibs as libmpv; the release build fails without libsmb2.so.
          tools/libsmb2/bundle.sh android \
            clients/flutter/packages/media_kit_libs_android_video/android/src/main/jniLibs \
            "$RUNNER_TEMP"/libsmb2/libsmb2-android-{arm64-v8a,armeabi-v7a,x86_64}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core (pa_core Native Assets, UI-024)
        working-directory: core/crates/pa-frb
        # Channel and targets (Linux, Android) from the crate's rust-toolchain.toml;
        # the pa_core build hook compiles libpa_frb into the app with it.
        run: rustup toolchain install
      - name: Bundled anime database (META-030, ODbL)
        run: |
          rustup toolchain install
          data/anime-mappings/build.sh "$RUNNER_TEMP/anime-db"
          install -m 644 "$RUNNER_TEMP/anime-db/anime-offline-ids.jsonl.zst" \
            "$RUNNER_TEMP/anime-db/LICENSE.anime-offline-database" "$APP_DIR/assets/anime-db/"
      - name: flutter build apk (split per ABI + universal)
        working-directory: ${{ env.APP_DIR }}
        env:
          # Project TMDB key (DEC-008), baked into the Rust core; the build
          # hook passes only CARGO_* through (pa-metadata key.rs).
          CARGO_PA_TMDB_API_KEY: ${{ secrets.PA_TMDB_API_KEY }}
          # Project OpenSubtitles consumer key (PLAY-008), baked into the core
          # the same way; without it users enter their own key in Settings.
          CARGO_PA_OPENSUBTITLES_API_KEY: ${{ secrets.PA_OPENSUBTITLES_API_KEY }}
          # Fanart.tv project key (META-012): clear logos and clear art;
          # without it only users with a personal key in Settings get them.
          CARGO_PA_FANART_API_KEY: ${{ secrets.PA_FANART_API_KEY }}
          # Public OAuth client ids of the clouds (NET-017) and the MEGA app
          # key, baked into the core; empty: users enter their own client id.
          CARGO_PA_GDRIVE_CLIENT_ID: ${{ secrets.PA_GDRIVE_CLIENT_ID }}
          CARGO_PA_GDRIVE_CLIENT_SECRET: ${{ secrets.PA_GDRIVE_CLIENT_SECRET }}
          CARGO_PA_ONEDRIVE_CLIENT_ID: ${{ secrets.PA_ONEDRIVE_CLIENT_ID }}
          CARGO_PA_DROPBOX_CLIENT_ID: ${{ secrets.PA_DROPBOX_CLIENT_ID }}
          CARGO_PA_MEGA_APP_KEY: ${{ secrets.PA_MEGA_APP_KEY }}
          # Public Twitch client id (TWI-013), owner-registered app; a secret
          # only so it stays out of git (DEC-006).
          KINOLUNE_TWITCH_CLIENT_ID: ${{ secrets.KINOLUNE_TWITCH_CLIENT_ID }}
          # Monotonic versionCode; split APKs get +1000*ABI on top (Flutter).
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          common=(--release --target-platform "android-arm,android-arm64,android-x64"
                  --build-name "$VERSION" --build-number "$BUILD_NUMBER"
                  --dart-define=KINOLUNE_VERSION="$VERSION" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" --dart-define=KINOLUNE_TWITCH_CLIENT_ID="$KINOLUNE_TWITCH_CLIENT_ID")
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          apks=build/app/outputs/flutter-apk
          flutter build apk "${common[@]}" --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$apks/app-$abi-release.apk" "$out/kinolune-$VERSION-android-$abi.apk"
          done
          flutter build apk "${common[@]}"
          cp "$apks/app-release.apk" "$out/kinolune-$VERSION-android-universal.apk"
          ls -l "$out"
          # The library runs on the Rust core (UI-024): libpa_frb in every ABI.
          for apk in "$out"/*.apk; do
            for abi in arm64-v8a armeabi-v7a x86_64; do
              case "$apk" in *-android-universal.apk|*-android-$abi.apk) ;; *) continue ;; esac
              unzip -l "$apk" "lib/$abi/libpa_frb.so" >/dev/null \
                || { echo "::error::$apk has no lib/$abi/libpa_frb.so (Rust core)"; exit 1; }
            done
          done
          # Every APK carries the full flavor of the core (CORE-013).
          for apk in "$out"/*.apk; do "$GITHUB_WORKSPACE/tools/flavor/check-artifacts.sh" full "$apk"; done
          # In-app updates (PKG-018) install through PackageInstaller: full APKs ask for the permission.
          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 | sort -V | tail -n1)"
          for apk in "$out"/*.apk; do
            "$aapt2" dump permissions "$apk" | grep -q REQUEST_INSTALL_PACKAGES \
              || { echo "::error::$apk lacks REQUEST_INSTALL_PACKAGES (in-app updates)"; exit 1; }
          done
      - name: Sign APKs
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mode=$(packaging/app/android/sign.sh dist/*.apk)
          echo "signing=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = debug ]; then
            echo "::warning::No release keystore in secrets: APKs are debug-signed"
          fi
      - name: Licence gate for native libraries
        id: licences
        run: |
          mkdir -p notes
          packaging/app/android/check-native-licences.sh notes/native-licences.md dist/*.apk > "$RUNNER_TEMP/gate.out"
          tail -n2 "$RUNNER_TEMP/gate.out" >> "$GITHUB_OUTPUT"
          cat notes/native-licences.md >> "$GITHUB_STEP_SUMMARY"
          # Every APK and ABI must carry our libmpv set, or nothing plays.
          if ! grep -qx libmpv=yes "$RUNNER_TEMP/gate.out"; then
            echo "::error::an APK or ABI lacks the tools/mpv libmpv set"; exit 1
          fi
          # ... and libsmb2, or SMB sources fail (LIB-019).
          if ! grep -qx libsmb2=yes "$RUNNER_TEMP/gate.out"; then
            echo "::error::an APK or ABI lacks libsmb2.so (tools/libsmb2)"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            dist/
            notes/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'macos'
    # Xcode 26 (macOS 26 SDK): connectivity_plus 7.3 uses NWPath API that
    # Xcode 16 on macos-15 does not have. The app still targets macOS 12.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-macos-*
          path: ${{ runner.temp }}/libmpv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-apple
          path: ${{ runner.temp }}/libsmb2
      - name: Our libmpv as macOS frameworks (PKG-019)
        run: |
          # The app's media_kit_libs_macos_video pod embeds these; its podspec
          # stops the build without them.
          packaging/app/macos/mpv-frameworks.sh clients/flutter/packages/media_kit_libs_macos_video/macos/Frameworks \
            "$RUNNER_TEMP/libmpv/libmpv-macos-arm64" "$RUNNER_TEMP/libmpv/libmpv-macos-x86_64"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core (pa_core Native Assets, UI-024)
        working-directory: core/crates/pa-frb
        # aarch64-apple-darwin and x86_64-apple-darwin come from the crate's
        # rust-toolchain.toml; the hook builds both slices of the universal app.
        run: rustup toolchain install
      - name: flutter build macos (universal)
        working-directory: ${{ env.APP_DIR }}
        env:
          # Project TMDB key (DEC-008), baked into the Rust core; the build
          # hook passes only CARGO_* through (pa-metadata key.rs).
          CARGO_PA_TMDB_API_KEY: ${{ secrets.PA_TMDB_API_KEY }}
          # Project OpenSubtitles consumer key (PLAY-008), baked into the core
          # the same way; without it users enter their own key in Settings.
          CARGO_PA_OPENSUBTITLES_API_KEY: ${{ secrets.PA_OPENSUBTITLES_API_KEY }}
          # Fanart.tv project key (META-012): clear logos and clear art;
          # without it only users with a personal key in Settings get them.
          CARGO_PA_FANART_API_KEY: ${{ secrets.PA_FANART_API_KEY }}
          # Public OAuth client ids of the clouds (NET-017) and the MEGA app
          # key, baked into the core; empty: users enter their own client id.
          CARGO_PA_GDRIVE_CLIENT_ID: ${{ secrets.PA_GDRIVE_CLIENT_ID }}
          CARGO_PA_GDRIVE_CLIENT_SECRET: ${{ secrets.PA_GDRIVE_CLIENT_SECRET }}
          CARGO_PA_ONEDRIVE_CLIENT_ID: ${{ secrets.PA_ONEDRIVE_CLIENT_ID }}
          CARGO_PA_DROPBOX_CLIENT_ID: ${{ secrets.PA_DROPBOX_CLIENT_ID }}
          CARGO_PA_MEGA_APP_KEY: ${{ secrets.PA_MEGA_APP_KEY }}
          # Public Twitch client id (TWI-013), owner-registered app; a secret
          # only so it stays out of git (DEC-006).
          KINOLUNE_TWITCH_CLIENT_ID: ${{ secrets.KINOLUNE_TWITCH_CLIENT_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -version
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter build macos --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=KINOLUNE_VERSION="$VERSION" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" --dart-define=KINOLUNE_TWITCH_CLIENT_ID="$KINOLUNE_TWITCH_CLIENT_ID"
          # What CocoaPods and SwiftPM wrote into the runner project; commit it
          # when it changes (uploaded with the smoke results).
          mkdir -p "$RUNNER_TEMP/smoke"
          git diff -- macos > "$RUNNER_TEMP/smoke/macos-project.diff" || true
          git status --short -- macos > "$RUNNER_TEMP/smoke/macos-project.status" || true
          if [ -f macos/Podfile.lock ]; then cp macos/Podfile.lock "$RUNNER_TEMP/smoke/"; fi
      - name: Package DMGs (arm64 + x86_64, ad-hoc signed, with libsmb2 and licences)
        run: |
          packaging/app/macos/package.sh "$APP_DIR/build/macos/Build/Products/Release/Kinolune.app" "$VERSION" dist \
            "$RUNNER_TEMP/libsmb2/macos-arm64" "$RUNNER_TEMP/libsmb2/macos-x86_64"
          # The core is the full flavor (CORE-013).
          for arch in arm64 x86_64; do
            mnt="$RUNNER_TEMP/mnt-$arch"
            hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "dist/kinolune-$VERSION-macos-$arch.dmg"
            test -L "$mnt/Applications"
            grep -q 'xattr -dr com.apple.quarantine' "$mnt/Установка — Install.txt"
            test "$(lipo -archs "$mnt/Kinolune.app/Contents/MacOS/Kinolune")" = "$arch"
            tools/flavor/check-artifacts.sh full "$mnt/Kinolune.app"
            hdiutil detach "$mnt"
          done
          ls -l dist
      - name: libmpv audio devices (PKG-021)
        run: |
          # What media_kit does when a video starts: observe and read
          # audio-device-list (mpv lists the CoreAudio devices), play a file
          # through CoreAudio and through the null output. alpha.11 crashed
          # here (SIGSEGV at 0x0 in ca_get_str). Runs against the frameworks
          # inside the packaged app.
          mkdir -p "$RUNNER_TEMP/run" "$RUNNER_TEMP/smoke"
          # The runner is Apple silicon: use the arm64 image's app.
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "dist/kinolune-$VERSION-macos-arm64.dmg"
          ditto "$RUNNER_TEMP/mnt/Kinolune.app" "$RUNNER_TEMP/run/Kinolune.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          tools/mpv/tests/audio_devices/run-macos.sh "$RUNNER_TEMP/run/Kinolune.app/Contents/Frameworks" \
            "$RUNNER_TEMP/libmpv/libmpv-macos-arm64/include" "$RUNNER_TEMP/audio-devices" 10
          cp "$RUNNER_TEMP"/audio-devices/ao-*.log "$RUNNER_TEMP/smoke/"
      - name: Smoke test (start, play a file, 30 s, screenshots)
        run: |
          shots="$RUNNER_TEMP/smoke"
          app="$RUNNER_TEMP/run/Kinolune.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/Kinolune"
          # PKG-021: the app opens the player on this file after start-up.
          # The runner VM has no accelerated OpenGL, so this covers the CPU
          # video output (pa_player's fallback), not the GPU one.
          KINOLUNE_SMOKE_PLAY="$RUNNER_TEMP/audio-devices/sample.avi" \
            "$app/Contents/MacOS/Kinolune" > "$shots/app.log" 2>&1 &
          pid=$!
          sleep 10
          osascript -e 'tell application id "app.kinolune" to activate' || true
          sleep 8
          screencapture -x "$shots/macos-play.png" || echo "::warning::screencapture failed"
          sleep 12
          alive=true
          kill -0 "$pid" 2>/dev/null || alive=false
          screencapture -x "$shots/macos-play-30s.png" || echo "::warning::screencapture failed"
          if [ "$alive" = true ]; then kill "$pid"; wait "$pid" || true; fi
          cat "$shots/app.log"
          ls -l "$shots"
          if [ "$alive" != true ]; then
            # The report is written a moment after the process dies.
            sleep 10
            cp ~/Library/Logs/DiagnosticReports/Kinolune* "$shots/" 2>/dev/null || true
            packaging/app/macos/ips-summary.py "$shots"/Kinolune*.ips || true
            echo "::error::Kinolune exited within 30 s of start (playing a file)"; exit 1
          fi
          grep -q 'KINOLUNE_SMOKE_PLAY open ' "$shots/app.log" \
            || { echo "::error::the app did not open the player"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'windows'
    # Visual Studio 2022 with the C++ workload (Flutter's Windows toolchain).
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
          [ -f design/flutter/pa_design/fonts/InterVariable.ttf ] || { echo "::error::Inter was not fetched"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-windows-x86_64
          path: ${{ runner.temp }}/libmpv-windows-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-windows-x86_64
          path: ${{ runner.temp }}/libsmb2-windows-x86_64
      - name: Our libmpv and ANGLE for media_kit (PKG-020)
        run: |
          # The app's media_kit_libs_windows_video package copies these next to
          # Kinolune.exe; its CMake stops the build without them.
          packaging/app/windows/mpv-libs.sh clients/flutter/packages/media_kit_libs_windows_video/windows/libs \
            "$RUNNER_TEMP/libmpv-windows-x86_64"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core (pa_core Native Assets, UI-024)
        working-directory: core/crates/pa-frb
        # x86_64-pc-windows-msvc comes from the crate's rust-toolchain.toml.
        run: rustup toolchain install
      - name: flutter build windows
        working-directory: ${{ env.APP_DIR }}
        env:
          # Project TMDB key (DEC-008), baked into the Rust core; the build
          # hook passes only CARGO_* through (pa-metadata key.rs).
          CARGO_PA_TMDB_API_KEY: ${{ secrets.PA_TMDB_API_KEY }}
          # Project OpenSubtitles consumer key (PLAY-008), baked into the core
          # the same way; without it users enter their own key in Settings.
          CARGO_PA_OPENSUBTITLES_API_KEY: ${{ secrets.PA_OPENSUBTITLES_API_KEY }}
          # Fanart.tv project key (META-012): clear logos and clear art;
          # without it only users with a personal key in Settings get them.
          CARGO_PA_FANART_API_KEY: ${{ secrets.PA_FANART_API_KEY }}
          # Public OAuth client ids of the clouds (NET-017) and the MEGA app
          # key, baked into the core; empty: users enter their own client id.
          CARGO_PA_GDRIVE_CLIENT_ID: ${{ secrets.PA_GDRIVE_CLIENT_ID }}
          CARGO_PA_GDRIVE_CLIENT_SECRET: ${{ secrets.PA_GDRIVE_CLIENT_SECRET }}
          CARGO_PA_ONEDRIVE_CLIENT_ID: ${{ secrets.PA_ONEDRIVE_CLIENT_ID }}
          CARGO_PA_DROPBOX_CLIENT_ID: ${{ secrets.PA_DROPBOX_CLIENT_ID }}
          CARGO_PA_MEGA_APP_KEY: ${{ secrets.PA_MEGA_APP_KEY }}
          # Public Twitch client id (TWI-013), owner-registered app; a secret
          # only so it stays out of git (DEC-006).
          KINOLUNE_TWITCH_CLIENT_ID: ${{ secrets.KINOLUNE_TWITCH_CLIENT_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter build windows --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=KINOLUNE_VERSION="$VERSION" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" --dart-define=KINOLUNE_TWITCH_CLIENT_ID="$KINOLUNE_TWITCH_CLIENT_ID"
          ls -l build/windows/x64/runner/Release
      - name: Package zip (with libsmb2, VC++ runtime and licences)
        run: |
          # App-local Visual C++ runtime (msvcp140, vcruntime140*) from the
          # runner's Visual Studio redistributable folder.
          vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath | tr -d '\r')"
          PA_VCREDIST_DIR="$(ls -d "$(cygpath -u "$vs")"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -n1)"
          export PA_VCREDIST_DIR
          echo "VC++ runtime from $PA_VCREDIST_DIR"
          packaging/app/windows/package.sh "$APP_DIR/build/windows/x64/runner/Release" "$VERSION" dist \
            "$RUNNER_TEMP/libsmb2-windows-x86_64"
          # The core is the full flavor (CORE-013). Git Bash has no binutils:
          # packaging/app/windows/bin/strings stands in for `strings -a`.
          command -v strings >/dev/null || export PATH="$PWD/packaging/app/windows/bin:$PATH"
          tools/flavor/check-artifacts.sh full "$APP_DIR/build/windows/x64/runner/Release/pa_frb.dll"
      - name: Smoke test (start, 30 s, single instance, screenshot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shots = Join-Path $env:RUNNER_TEMP 'smoke'
          $run = Join-Path $env:RUNNER_TEMP 'run'
          New-Item -ItemType Directory -Force -Path $shots, $run | Out-Null
          Expand-Archive -Path "dist/kinolune-$env:VERSION-windows-x64.zip" -DestinationPath $run
          $exe = Join-Path $run "kinolune-$env:VERSION-windows-x64/Kinolune.exe"
          $p = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput (Join-Path $shots 'app.out.log') -RedirectStandardError (Join-Path $shots 'app.err.log')
          Start-Sleep -Seconds 15
          # A second start must hand over to the first window and exit; with
          # a kinolune:// link it passes it on (WM_COPYDATA, UI-022).
          $second = Start-Process -FilePath $exe -PassThru -ArgumentList 'kinolune://search?q=smoke'
          if (-not $second.WaitForExit(15000)) { Stop-Process -Id $second.Id -Force; $single = $false } else { $single = $true }
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $shots 'windows-start.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Output "::warning::screenshot failed: $_" }
          if ($alive) { Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2 } else { Write-Output "exit code: $($p.ExitCode)" }
          # The app's own logs (pa-log, CORE-008) under %APPDATA%\app.kinolune.
          $data = Join-Path $env:APPDATA 'app.kinolune'
          if (Test-Path $data) {
            Get-ChildItem -Path $data -Recurse -File -Include *.log, *.txt, *.jsonl -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path $shots ("data-" + $_.Name)) }
            Get-ChildItem -Path $data -Recurse | Select-Object FullName, Length | Out-File (Join-Path $shots 'data-tree.txt')
          }
          Get-ChildItem $shots | Format-Table Name, Length
          foreach ($f in Get-ChildItem $shots -Filter '*.log') { Write-Output "== $($f.Name)"; Get-Content $f.FullName }
          if (-not $alive) { Write-Output '::error::Kinolune exited within 30 s of start'; exit 1 }
          if (-not $single) { Write-Output '::error::a second Kinolune.exe did not exit (single instance)'; exit 1 }
          $bad = Select-String -Path (Join-Path $shots '*.log') -Pattern 'Unhandled Exception', 'EXCEPTION CAUGHT BY' -SimpleMatch
          if ($bad) { $bad | ForEach-Object { Write-Output "::error::$($_.Line)" }; exit 1 }
      - name: Inno Setup (pinned version and SHA-256, PKG-022)
        id: inno
        run: echo "iscc=$(packaging/app/windows/fetch-inno.sh "$RUNNER_TEMP/inno-setup")" >> "$GITHUB_OUTPUT"
      - name: Build the installer (per user, from the zip)
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: |
          packaging/app/windows/installer.sh "dist/kinolune-$VERSION-windows-x64.zip" "$VERSION" dist
          ls -l dist
      - name: Installer smoke test (silent install, start, silent uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shots = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $setup = (Resolve-Path "dist/kinolune-$env:VERSION-windows-x64-setup.exe").Path
          $p = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$shots\setup-install.log"
          if ($p.ExitCode -ne 0) { Write-Output "::error::setup exit code $($p.ExitCode)"; exit 1 }
          # Per user, no administrator rights: %LOCALAPPDATA%\Programs\Kinolune.
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Kinolune'
          foreach ($f in 'Kinolune.exe', 'unins000.exe', 'pa_frb.dll', 'libmpv-2.dll', 'README-windows.txt',
                         'licenses\LICENSE', 'licenses\THIRD-PARTY-NOTICES.md', 'licenses\libmpv') {
            if (-not (Test-Path (Join-Path $app $f))) { Write-Output "::error::not installed: $f"; exit 1 }
          }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Kinolune.lnk'
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Kinolune.lnk'
          foreach ($l in $menu, $desk) { if (-not (Test-Path $l)) { Write-Output "::error::no shortcut $l"; exit 1 } }
          # «Параметры → Приложения» lists it (per user: HKCU).
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C3AAEA23-CF87-4B39-BFFF-855E4693C7BE}_is1'
          $entry = Get-ItemProperty -Path $key
          Write-Output "Uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion) $($entry.UninstallString)"
          if ($entry.DisplayVersion -ne $env:VERSION) { Write-Output "::error::DisplayVersion $($entry.DisplayVersion)"; exit 1 }
          $exe = Join-Path $app 'Kinolune.exe'
          # kinolune:// links open the installed app (UI-022, HKCU).
          $open = (Get-ItemProperty -Path 'HKCU:\Software\Classes\kinolune\shell\open\command').'(default)'
          Write-Output "kinolune:// handler: $open"
          if ($open -notlike "*$exe*%1*") { Write-Output "::error::kinolune:// is not registered: $open"; exit 1 }
          $run = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $run.HasExited
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $shots 'windows-installed.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Output "::warning::screenshot failed: $_" }
          if ($alive) { Stop-Process -Id $run.Id -Force; Start-Sleep -Seconds 2 }
          else { Write-Output "::error::the installed Kinolune exited within 20 s ($($run.ExitCode))"; exit 1 }
          $u = Start-Process -FilePath (Join-Path $app 'unins000.exe') -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$shots\setup-uninstall.log"
          Write-Output "uninstaller exit code $($u.ExitCode)"
          # The uninstaller runs from a temporary copy: wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Output '::error::Kinolune.exe is still there after the uninstall'; exit 1 }
          if (Test-Path 'HKCU:\Software\Classes\kinolune') { Write-Output '::error::kinolune:// is still registered after the uninstall'; exit 1 }
          if (Test-Path $key) { Write-Output '::error::the uninstall entry is still there'; exit 1 }
          foreach ($l in $menu, $desk) { if (Test-Path $l) { Write-Output "::error::shortcut left: $l"; exit 1 } }
          Write-Output 'Silent install, start and silent uninstall: OK'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # PKG-022: the update path end to end. Two builds of this commit, an
  # older and a newer version, both pointed at a local stand-in for the
  # GitHub releases API (KINOLUNE_UPDATES_API) and a throwaway minisign key
  # made in the job (KINOLUNE_UPDATES_TEST_KEY; release builds set neither).
  # The older one is installed and started like a person would; its
  # scheduled check finds the newer release, downloads, verifies and installs
  # it, and the app relaunches as the newer version. Since PKG-024 nothing
  # stands in for a click: the update is silent, and the app restarts into
  # it by itself once idle with nothing playing. KINOLUNE_UPDATE_SMOKE gives
  # the test a log and shortens the idle time to seconds (and drops the
  # "window in front" rule: runners have no window manager). The newer
  # version must also show the «Что нового» note ("Updated to" in the log).
  windows-update:
    name: Windows update test (installed alpha.N -> alpha.N+1)
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'windows'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      OLD: 0.0.1-e2e.1
      NEW: 0.0.1-e2e.2
      API: http://127.0.0.1:8765/releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: node design/scripts/fonts-fetch.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-windows-x86_64
          path: ${{ runner.temp }}/libmpv-windows-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-windows-x86_64
          path: ${{ runner.temp }}/libsmb2-windows-x86_64
      - name: Our libmpv and ANGLE for media_kit
        run: |
          packaging/app/windows/mpv-libs.sh clients/flutter/packages/media_kit_libs_windows_video/windows/libs \
            "$RUNNER_TEMP/libmpv-windows-x86_64"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core
        working-directory: core/crates/pa-frb
        run: rustup toolchain install
      - name: Throwaway release key (rsign2) and Inno Setup
        id: tools
        run: |
          cargo install --locked --quiet rsign2@0.6.7
          mkdir -p "$RUNNER_TEMP/key"
          rsign generate -W -f -p "$RUNNER_TEMP/key/test.pub" -s "$RUNNER_TEMP/key/test.key"
          echo "pub=$(sed -n 2p "$RUNNER_TEMP/key/test.pub" | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "iscc=$(packaging/app/windows/fetch-inno.sh "$RUNNER_TEMP/inno-setup")" >> "$GITHUB_OUTPUT"
      - name: Build both versions and their installers
        env:
          TEST_KEY: ${{ steps.tools.outputs.pub }}
          ISCC: ${{ steps.tools.outputs.iscc }}
        run: |
          vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath | tr -d '\r')"
          PA_VCREDIST_DIR="$(ls -d "$(cygpath -u "$vs")"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -n1)"
          export PA_VCREDIST_DIR
          (cd "$APP_DIR" && flutter pub get --enforce-lockfile)
          for v in "$OLD" "$NEW"; do
            (cd "$APP_DIR" && flutter build windows --release --build-name "$v" --build-number 1 \
              --dart-define=KINOLUNE_VERSION="$v" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" \
              --dart-define=KINOLUNE_UPDATES_API="$API" --dart-define=KINOLUNE_UPDATES_TEST_KEY="$TEST_KEY")
            packaging/app/windows/package.sh "$APP_DIR/build/windows/x64/runner/Release" "$v" "$RUNNER_TEMP/e2e/$v" \
              "$RUNNER_TEMP/libsmb2-windows-x86_64"
            packaging/app/windows/installer.sh "$RUNNER_TEMP/e2e/$v/kinolune-$v-windows-x64.zip" "$v" "$RUNNER_TEMP/e2e/$v"
          done
          ls -lR "$RUNNER_TEMP/e2e"
      - name: The newer version as a signed test release
        run: |
          srv="$RUNNER_TEMP/serve"
          mkdir -p "$srv/assets"
          cp "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-windows-x64-setup.exe" "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-windows-x64.zip" "$srv/assets/"
          (cd "$srv/assets" && sha256sum -- * > SHA256SUMS)
          rsign sign -W -s "$RUNNER_TEMP/key/test.key" -x "$srv/assets/SHA256SUMS.minisig" \
            -t "$(printf 'timestamp:%s\tfile:SHA256SUMS\thashed' "$(date +%s)")" "$srv/assets/SHA256SUMS"
          python -I packaging/app/update-test/release-json.py "$srv" "$NEW" "${API%/releases}"
      - name: Install alpha.N, let it update itself, expect alpha.N+1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'update-e2e'
          New-Item -ItemType Directory -Force -Path $log | Out-Null
          $http = Start-Process -FilePath python -PassThru -WindowStyle Hidden `
            -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', (Join-Path $env:RUNNER_TEMP 'serve') `
            -RedirectStandardOutput (Join-Path $log 'http.out.log') -RedirectStandardError (Join-Path $log 'http.log')
          Start-Sleep -Seconds 3
          $old = Join-Path $env:RUNNER_TEMP "e2e\$env:OLD\kinolune-$env:OLD-windows-x64-setup.exe"
          $p = Start-Process -FilePath $old -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { Write-Output "::error::setup of $env:OLD: exit code $($p.ExitCode)"; exit 1 }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C3AAEA23-CF87-4B39-BFFF-855E4693C7BE}_is1'
          Write-Output "Installed: $((Get-ItemProperty -Path $key).DisplayVersion)"
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Kinolune\Kinolune.exe'
          $env:KINOLUNE_UPDATE_SMOKE = $log
          Start-Process -FilePath $exe | Out-Null
          $smoke = Join-Path $log 'update-smoke.log'
          $ok = $false
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ((Test-Path $smoke) -and (Select-String -Path $smoke -SimpleMatch "Running $env:NEW " -Quiet)) { $ok = $true; break }
          }
          Start-Sleep -Seconds 5
          if (Test-Path $smoke) { Get-Content $smoke }
          $now = (Get-ItemProperty -Path $key).DisplayVersion
          Write-Output "Installed after the update: $now; Kinolune.exe $((Get-Item $exe).VersionInfo.ProductVersion)"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $log 'windows-after-update.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Output "::warning::screenshot failed: $_" }
          Get-Process -Name Kinolune -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $http.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Filter 'Setup Log*.txt' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $log }
          if (-not $ok) { Write-Output "::error::Kinolune $env:OLD did not relaunch as $env:NEW"; exit 1 }
          if ($now -ne $env:NEW) { Write-Output "::error::the installed version is $now, not $env:NEW"; exit 1 }
          if (-not (Select-String -Path $smoke -SimpleMatch "Updated to $env:NEW" -Quiet)) { Write-Output "::error::no «Что нового» note in $env:NEW"; exit 1 }
          Write-Output "Updated $env:OLD -> $env:NEW without a click; the app relaunched as $env:NEW."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-update-test
          path: ${{ runner.temp }}/update-e2e
          if-no-files-found: ignore
          retention-days: 7

  macos-update:
    name: macOS update test (installed alpha.N -> alpha.N+1)
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'macos'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      OLD: 0.0.1-e2e.1
      NEW: 0.0.1-e2e.2
      API: http://127.0.0.1:8765/releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: node design/scripts/fonts-fetch.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-macos-*
          path: ${{ runner.temp }}/libmpv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-apple
          path: ${{ runner.temp }}/libsmb2
      - name: Our libmpv as macOS frameworks
        run: |
          packaging/app/macos/mpv-frameworks.sh clients/flutter/packages/media_kit_libs_macos_video/macos/Frameworks \
            "$RUNNER_TEMP/libmpv/libmpv-macos-arm64" "$RUNNER_TEMP/libmpv/libmpv-macos-x86_64"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core
        working-directory: core/crates/pa-frb
        run: rustup toolchain install
      - name: Throwaway release key (rsign2)
        id: tools
        run: |
          cargo install --locked --quiet rsign2@0.6.7
          mkdir -p "$RUNNER_TEMP/key"
          rsign generate -W -f -p "$RUNNER_TEMP/key/test.pub" -s "$RUNNER_TEMP/key/test.key"
          echo "pub=$(sed -n 2p "$RUNNER_TEMP/key/test.pub")" >> "$GITHUB_OUTPUT"
      - name: Build both versions and their DMGs
        env:
          TEST_KEY: ${{ steps.tools.outputs.pub }}
        run: |
          (cd "$APP_DIR" && flutter pub get --enforce-lockfile)
          for v in "$OLD" "$NEW"; do
            (cd "$APP_DIR" && flutter build macos --release --build-name "$v" --build-number 1 \
              --dart-define=KINOLUNE_VERSION="$v" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" \
              --dart-define=KINOLUNE_UPDATES_API="$API" --dart-define=KINOLUNE_UPDATES_TEST_KEY="$TEST_KEY")
            packaging/app/macos/package.sh "$APP_DIR/build/macos/Build/Products/Release/Kinolune.app" "$v" "$RUNNER_TEMP/e2e/$v" \
              "$RUNNER_TEMP/libsmb2/macos-arm64" "$RUNNER_TEMP/libsmb2/macos-x86_64"
          done
          ls -lR "$RUNNER_TEMP/e2e"
      - name: The newer version as a signed test release
        run: |
          srv="$RUNNER_TEMP/serve"
          mkdir -p "$srv/assets"
          cp "$RUNNER_TEMP/e2e/$NEW"/kinolune-"$NEW"-macos-*.dmg "$srv/assets/"
          (cd "$srv/assets" && shasum -a 256 -- * > SHA256SUMS)
          rsign sign -W -s "$RUNNER_TEMP/key/test.key" -x "$srv/assets/SHA256SUMS.minisig" \
            -t "$(printf 'timestamp:%s\tfile:SHA256SUMS\thashed' "$(date +%s)")" "$srv/assets/SHA256SUMS"
          python3 -I packaging/app/update-test/release-json.py "$srv" "$NEW" "${API%/releases}"
      - name: Install alpha.N, let it update itself, expect alpha.N+1
        run: |
          log="$RUNNER_TEMP/update-e2e"
          mkdir -p "$log" "$HOME/Applications"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" > "$log/http.log" 2>&1 &
          http=$!
          # Installed like a person does: Kinolune.app copied out of the DMG
          # of this Mac's architecture (the runner is Apple silicon).
          mnt="$RUNNER_TEMP/mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$RUNNER_TEMP/e2e/$OLD/kinolune-$OLD-macos-arm64.dmg"
          app="$HOME/Applications/Kinolune.app"
          ditto "$mnt/Kinolune.app" "$app"
          hdiutil detach "$mnt"
          plist() { plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"; }
          echo "Installed: $(plist)"
          # macOS bundles hold only numbers: compare with the new DMG's bundle.
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-macos-arm64.dmg"
          want="$(plutil -extract CFBundleShortVersionString raw "$mnt/Kinolune.app/Contents/Info.plist")"
          hdiutil detach "$mnt"
          KINOLUNE_UPDATE_SMOKE="$log" "$app/Contents/MacOS/Kinolune" > "$log/app-old.log" 2>&1 &
          ok=false
          for _ in $(seq 120); do
            sleep 5
            if grep -qF "Running $NEW " "$log/update-smoke.log" 2>/dev/null; then ok=true; break; fi
          done
          sleep 5
          cat "$log/update-smoke.log" || true
          now="$(plist)"
          echo "Installed after the update: $now"
          screencapture -x "$log/macos-after-update.png" || true
          ls -la "$HOME/Applications"
          pkill -x Kinolune || true
          kill "$http" || true
          [ "$ok" = true ] || { echo "::error::Kinolune $OLD did not relaunch as $NEW"; exit 1; }
          [ "$now" = "$want" ] || { echo "::error::the installed bundle version is $now, not $want ($NEW)"; exit 1; }
          grep -qF "Updated to $NEW" "$log/update-smoke.log" || { echo "::error::no «Что нового» note in $NEW"; exit 1; }
          codesign --verify --deep --strict "$app"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "::error::the new app is quarantined"; exit 1; fi
          # The swapped-out bundle is removed when the new version starts.
          if ls -d "$HOME/Applications"/.Kinolune.app.* 2>/dev/null; then echo "::error::leftovers next to the app"; exit 1; fi
          echo "Updated $OLD -> $NEW without a click; the app relaunched as $NEW."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-update-test
          path: ${{ runner.temp }}/update-e2e
          if-no-files-found: ignore
          retention-days: 7

  # PKG-024: the same silent update path for a Linux AppImage. Xvfb runs on
  # its own (not xvfb-run): the old app exits after starting the new one.
  linux-update:
    name: Linux update test (AppImage alpha.N -> alpha.N+1)
    needs: [meta, libmpv, libsmb2]
    if: needs.meta.outputs.platforms == 'all' || needs.meta.outputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OLD: 0.0.1-e2e.1
      NEW: 0.0.1-e2e.2
      API: http://127.0.0.1:8765/releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            patchelf libva2 libva-drm2 libdrm2 libegl1 libpulse0 libasound2t64 \
            xvfb fuse3 libfuse2t64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-linux-x86_64
          path: ${{ runner.temp }}/libmpv-linux-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-linux-x86_64
          path: ${{ runner.temp }}/libsmb2-linux-x86_64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: node design/scripts/fonts-fetch.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Rust toolchain for the core
        working-directory: core/crates/pa-frb
        run: rustup toolchain install
      - name: Throwaway release key (rsign2)
        id: tools
        run: |
          cargo install --locked --quiet rsign2@0.6.7
          mkdir -p "$RUNNER_TEMP/key"
          rsign generate -W -f -p "$RUNNER_TEMP/key/test.pub" -s "$RUNNER_TEMP/key/test.key"
          echo "pub=$(sed -n 2p "$RUNNER_TEMP/key/test.pub")" >> "$GITHUB_OUTPUT"
      - name: Build both versions and their AppImages
        env:
          TEST_KEY: ${{ steps.tools.outputs.pub }}
          PA_LIBMPV_DIR: ${{ runner.temp }}/libmpv-linux-x86_64
          PA_LIBSMB2_DIR: ${{ runner.temp }}/libsmb2-linux-x86_64
        run: |
          export PKG_CONFIG_PATH="$PA_LIBMPV_DIR/lib/pkgconfig"
          (cd "$APP_DIR" && flutter pub get --enforce-lockfile)
          for v in "$OLD" "$NEW"; do
            (cd "$APP_DIR" && flutter build linux --release --build-name "$v" --build-number 1 \
              --dart-define=KINOLUNE_VERSION="$v" --dart-define=KINOLUNE_FLAVOR="$KINOLUNE_FLAVOR" \
              --dart-define=KINOLUNE_UPDATES_API="$API" --dart-define=KINOLUNE_UPDATES_TEST_KEY="$TEST_KEY")
            packaging/app/linux/package.sh "$APP_DIR/build/linux/x64/release/bundle" "$v" "$RUNNER_TEMP/e2e/$v"
          done
          ls -lR "$RUNNER_TEMP/e2e"
      - name: The newer version as a signed test release
        run: |
          srv="$RUNNER_TEMP/serve"
          mkdir -p "$srv/assets"
          cp "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-x86_64.AppImage" "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-linux-x86_64.tar.gz" "$srv/assets/"
          (cd "$srv/assets" && sha256sum -- * > SHA256SUMS)
          rsign sign -W -s "$RUNNER_TEMP/key/test.key" -x "$srv/assets/SHA256SUMS.minisig" \
            -t "$(printf 'timestamp:%s\tfile:SHA256SUMS\thashed' "$(date +%s)")" "$srv/assets/SHA256SUMS"
          python3 -I packaging/app/update-test/release-json.py "$srv" "$NEW" "${API%/releases}"
      - name: Start alpha.N, let it update itself, expect alpha.N+1
        run: |
          log="$RUNNER_TEMP/update-e2e"
          mkdir -p "$log" "$HOME/Applications"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" > "$log/http.log" 2>&1 &
          http=$!
          Xvfb :99 -screen 0 1600x1000x24 > "$log/xvfb.log" 2>&1 &
          xvfb=$!
          app="$HOME/Applications/Kinolune.AppImage"
          install -m 755 "$RUNNER_TEMP/e2e/$OLD/kinolune-$OLD-x86_64.AppImage" "$app"
          want="$(sha256sum < "$RUNNER_TEMP/e2e/$NEW/kinolune-$NEW-x86_64.AppImage")"
          DISPLAY=:99 KINOLUNE_UPDATE_SMOKE="$log" "$app" > "$log/app-old.log" 2>&1 &
          ok=false
          for _ in $(seq 120); do
            sleep 5
            if grep -qF "Running $NEW " "$log/update-smoke.log" 2>/dev/null; then ok=true; break; fi
          done
          sleep 5
          cat "$log/update-smoke.log" || true
          now="$(sha256sum < "$app")"
          DISPLAY=:99 import -window root "$log/linux-after-update.png" 2>/dev/null || true
          ls -la "$HOME/Applications"
          pkill -f "$app" || true
          kill "$http" "$xvfb" || true
          [ "$ok" = true ] || { echo "::error::Kinolune $OLD did not relaunch as $NEW"; tail -n 50 "$log/app-old.log"; exit 1; }
          [ "$now" = "$want" ] || { echo "::error::the AppImage is not the $NEW one"; exit 1; }
          grep -qF "Updated to $NEW" "$log/update-smoke.log" || { echo "::error::no «Что нового» note in $NEW"; exit 1; }
          if ls -a "$HOME/Applications" | grep -F '.update'; then echo "::error::leftovers next to the AppImage"; exit 1; fi
          echo "Updated $OLD -> $NEW without a click; the app relaunched as $NEW."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-update-test
          path: ${{ runner.temp }}/update-e2e
          if-no-files-found: ignore
          retention-days: 7

  linux-packages:
    name: Linux packages and repositories (containers)
    needs: [meta, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux
      - name: Install, upgrade and tamper tests in ubuntu:24.04, debian:13, fedora:latest
        # packaging/linux/test/repo-test.sh: this bundle packaged as 0.0.1,
        # 0.0.2 and 0.0.3-rc.1 with a throwaway key, served to clean
        # containers; README install, 20 s start under Xvfb, `apt upgrade` /
        # `dnf upgrade`, tampered and unsigned repositories refused.
        run: packaging/linux/test/repo-test.sh "$RUNNER_TEMP/linux/kinolune-$VERSION-linux-x86_64.tar.gz"

  assemble:
    name: Assemble release
    needs: [meta, libmpv, libsmb2, linux, linux-packages, android, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      DRY_RUN: ${{ needs.meta.outputs.dry_run }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Sign the rpm (PKG-023, repository key)
        # The same key signs the DNF repository (linux-repo.yml); the public
        # half is packaging/linux/kinolune-repo-public.asc.
        env:
          PA_PKG_REPO_GPG_KEY: ${{ secrets.PA_PKG_REPO_GPG_KEY }}
        run: |
          if [ -z "$PA_PKG_REPO_GPG_KEY" ]; then
            if [ "$DRY_RUN" = false ]; then echo "::error::No PA_PKG_REPO_GPG_KEY secret"; exit 1; fi
            echo "::warning::No PA_PKG_REPO_GPG_KEY secret: the rpm stays unsigned (dry run)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          fpr=$(packaging/linux/import-key.sh)
          rpm=$(ls artifacts/linux/kinolune-*-linux-x86_64.rpm)
          rpmsign --define "__gpg $(command -v gpg)" --define "_gpg_name $fpr" --define "_gpg_path $GNUPGHOME" \
            --define "_gpg_digest_algo sha512" --addsign "$rpm"
          rm -rf "$GNUPGHOME"
          db="$RUNNER_TEMP/rpmdb"; mkdir -p "$db"
          rpmkeys --dbpath "$db" --import packaging/linux/kinolune-repo-public.asc
          rpmkeys --dbpath "$db" --checksig "$rpm"
      - name: Collect assets, licences and checksums
        run: |
          mkdir -p release/assets
          cp artifacts/linux/* release/assets/
          cp artifacts/android/dist/* release/assets/
          cp artifacts/macos/* release/assets/
          cp artifacts/windows/* release/assets/
          # Only what people install (owner 2026-11-19): one file per platform,
          # plus the 32-bit APK for older Android TV boxes. The x86_64 and
          # universal APKs, the Windows zip and the Linux tar.gz stay in the
          # workflow artifacts (tests and the installer build use them).
          rm -f "release/assets/kinolune-$VERSION-android-x86_64.apk" \
                "release/assets/kinolune-$VERSION-android-universal.apk" \
                "release/assets/kinolune-$VERSION-windows-x64.zip" \
                "release/assets/kinolune-$VERSION-linux-x86_64.tar.gz"
          lic="kinolune-$VERSION-licenses"
          tp="kinolune-$VERSION-third-party"
          mkdir -p "$RUNNER_TEMP/$tp"
          mkdir -p "$RUNNER_TEMP/$lic/licenses"
          cp LICENSE packaging/app/THIRD-PARTY-NOTICES.md "$RUNNER_TEMP/$lic/"
          packaging/app/fetch-licences.sh "$RUNNER_TEMP/$lic/licenses"
          # Corresponding sources of the libmpv/FFmpeg shipped in the APKs and
          # the Linux bundle; checked against their BUILDINFO.txt.
          libmpv=(artifacts/libmpv-android-{arm64-v8a,armeabi-v7a,x86_64} artifacts/libmpv-linux-x86_64
                  artifacts/libmpv-macos-{arm64,x86_64} artifacts/libmpv-windows-x86_64)
          PA_LIBMPV_SOURCES="$(ls artifacts/libmpv-sources/project_alpha-libmpv-sources-*.tar.xz)" \
            packaging/app/lgpl-sources.sh "$RUNNER_TEMP/$tp/kinolune-$VERSION-libmpv-sources.tar.xz" \
            release/libmpv.md "${libmpv[@]}"
          cp release/libmpv.md "$RUNNER_TEMP/$lic/LIBMPV-COMPONENTS.md"
          mkdir -p "$RUNNER_TEMP/$lic/licenses/libmpv"
          for d in "${libmpv[@]}"; do cp "$d"/share/licenses/* "$RUNNER_TEMP/$lic/licenses/libmpv/"; done
          # The same for libsmb2 (LIB-019): its source bundle, notice and licences.
          libsmb2=(artifacts/libsmb2-android-{arm64-v8a,armeabi-v7a,x86_64} artifacts/libsmb2-linux-x86_64
                   artifacts/libsmb2-apple/macos-{arm64,x86_64} artifacts/libsmb2-windows-x86_64)
          PA_LIBSMB2_SOURCES="$(ls artifacts/libsmb2-sources/project_alpha-libsmb2-sources-*.tar.xz)" \
            packaging/app/libsmb2-sources.sh "$RUNNER_TEMP/$tp/kinolune-$VERSION-libsmb2-sources.tar.xz" \
            release/libsmb2.md "${libsmb2[@]}"
          cp release/libsmb2.md "$RUNNER_TEMP/$lic/LIBSMB2.md"
          cp artifacts/android/notes/native-licences.md "$RUNNER_TEMP/$lic/ANDROID-NATIVE-LIBRARIES.md"
          mkdir -p "$RUNNER_TEMP/$lic/licenses/libsmb2"
          for d in "${libsmb2[@]}"; do cp "$d"/share/licenses/* "$RUNNER_TEMP/$lic/licenses/libsmb2/"; done
          cp artifacts/libsmb2-linux-x86_64/BUILDINFO.txt "$RUNNER_TEMP/$lic/licenses/libsmb2/BUILDINFO.txt"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -czf "$RUNNER_TEMP/$tp/$lic.tar.gz" "$lic"
          # One file for licences and the LGPL corresponding sources (libmpv,
          # FFmpeg, libsmb2): LGPL-2.1 §6 is met by shipping them next to the
          # binaries; the README inside says what is where.
          cp packaging/app/THIRD-PARTY-README.md "$RUNNER_TEMP/$tp/README.md"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -cf "release/assets/$tp.tar" "$tp"
          (cd release/assets && sha256sum -- * > SHA256SUMS)
          cat release/assets/SHA256SUMS
      - name: Sign SHA256SUMS (minisign, PKG-018)
        # In-app updates refuse a release whose SHA256SUMS is not signed with
        # updates.release_public_key (signed remote config, ADR-0088). The
        # secret holds the passwordless release key made with rsign2.
        env:
          MINISIGN_RELEASE_KEY: ${{ secrets.MINISIGN_RELEASE_KEY }}
        run: |
          if [ -z "$MINISIGN_RELEASE_KEY" ]; then
            echo "::warning::No MINISIGN_RELEASE_KEY secret: SHA256SUMS is not signed"
            exit 0
          fi
          cargo install --locked --quiet rsign2@0.6.7
          key="$RUNNER_TEMP/release.key"
          ( umask 077 && printf '%s\n' "$MINISIGN_RELEASE_KEY" > "$key" )
          rsign sign -W -s "$key" -x release/assets/SHA256SUMS.minisig \
            -t "timestamp:$(date +%s)	file:SHA256SUMS	hashed" release/assets/SHA256SUMS
          rm -f "$key"
          rsign verify -P "$(jq -r '.updates.release_public_key' config/remote-config.json)" \
            -x release/assets/SHA256SUMS.minisig release/assets/SHA256SUMS
      - name: Release notes
        run: |
          notes=release/notes.md
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          message=""
          if [ "$DRY_RUN" = false ]; then
            git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              message=$(git tag -l --format='%(contents:body)' "$TAG")
              subject=$(git tag -l --format='%(contents:subject)' "$TAG")
              message=$(printf '%s\n\n%s\n' "$subject" "$message" | sed '/-----BEGIN/,$d')
            fi
          fi
          {
            if [ "$SIGNING" = debug ]; then
              echo "> [!WARNING]"
              echo "> Android: тестовая подпись — следующую версию поверх не поставить, сначала удалите эту."
              echo "> Android: debug-signed — uninstall it before installing a later release."
              echo
            fi
            if [ -n "$message" ]; then printf '%s\n\n' "$message"; else echo "Kinolune $VERSION."; echo; fi
            echo "## Скачать · Download"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Windows** 10/11 | [\`kinolune-$VERSION-windows-x64-setup.exe\`]($BASE/kinolune-$VERSION-windows-x64-setup.exe) |"
            echo "| **macOS** — Apple M1 и новее · Apple silicon | [\`kinolune-$VERSION-macos-arm64.dmg\`]($BASE/kinolune-$VERSION-macos-arm64.dmg) |"
            echo "| **macOS** — Intel | [\`kinolune-$VERSION-macos-x86_64.dmg\`]($BASE/kinolune-$VERSION-macos-x86_64.dmg) |"
            echo "| **Linux** (Ubuntu 24.04+) | [\`kinolune-$VERSION-x86_64.AppImage\`]($BASE/kinolune-$VERSION-x86_64.AppImage) |"
            echo "| **Ubuntu, Debian, Mint** (.deb) | [\`kinolune-$VERSION-linux-amd64.deb\`]($BASE/kinolune-$VERSION-linux-amd64.deb) |"
            echo "| **Fedora, openSUSE** (.rpm) | [\`kinolune-$VERSION-linux-x86_64.rpm\`]($BASE/kinolune-$VERSION-linux-x86_64.rpm) |"
            echo "| **Android** и Android TV | [\`kinolune-$VERSION-android-arm64-v8a.apk\`]($BASE/kinolune-$VERSION-android-arm64-v8a.apk) |"
            echo "| Старые 32-битные ТВ-приставки · older 32-bit TV boxes | [\`kinolune-$VERSION-android-armeabi-v7a.apk\`]($BASE/kinolune-$VERSION-android-armeabi-v7a.apk) |"
            echo
            echo "Дальше приложение обновляется само. · The app updates itself from then on."
            echo
            echo "<details><summary>Первый запуск · First start</summary>"
            echo
            echo "- **macOS:** приложение пока без нотаризации Apple. Перетащите Kinolune в «Программы», затем правый клик → **Открыть** → **Открыть** (macOS 15+: Настройки → Конфиденциальность и безопасность → **Всё равно открыть**). · Not notarized yet: right-click → **Open** → **Open** (macOS 15+: Privacy & Security → **Open Anyway**)."
            echo "- **Windows:** установщик без прав администратора. Если SmartScreen предупредит — **Подробнее** → **Выполнить в любом случае**. · No admin rights needed; on SmartScreen click **More info** → **Run anyway**."
            echo "- **Linux:** \`chmod +x\` на AppImage и запуск; .deb/.rpm добавляют репозиторий Kinolune, дальше \`apt upgrade\` / \`dnf upgrade\` (README: «Установка на Linux»). · Make the AppImage executable and run it; the .deb/.rpm add the Kinolune repository so \`apt upgrade\` / \`dnf upgrade\` bring updates."
            echo
            echo "</details>"
            echo
            echo "Проверка файлов · Verify: \`SHA256SUMS\` (подпись minisign · signed). Лицензии и исходники LGPL-библиотек (libmpv, FFmpeg, libsmb2) · Licences and LGPL sources: \`kinolune-$VERSION-third-party.tar\`. Kinolune — MPL-2.0."
          } > "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [meta, android, assemble]
    if: needs.meta.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Kinolune $VERSION"
          [ "$SIGNING" = debug ] && title="$title (Android debug-signed)"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file release/notes.md "${flags[@]}" release/assets/*

  linux-repo:
    name: Rebuild the APT/DNF repositories
    needs: [meta, publish]
    if: needs.meta.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start linux-repo.yml
    steps:
      - name: Start linux-repo.yml on main
        # On main: the github-pages environment deploys only from the
        # default branch, not from this tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linux-repo.yml --repo "$GITHUB_REPOSITORY" --ref main
