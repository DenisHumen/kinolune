# SPDX-License-Identifier: MPL-2.0
# Kinolune OS installer ISO (DIST-007): build the OS image and the live installer image,
# turn them into a UEFI live ISO with image-builder (generic-iso, offline payload), check
# that it stays below 1.9 GiB and boot it in QEMU/OVMF up to the installer (serial
# console smoke test). See distro/installer/README.md, section "Live-ISO".
#
# Fork-safe: read-only token, no secrets. The ISO itself is kept as an artifact only for
# runs on main and manual runs (to try on real hardware), not for pull requests.
name: distro-iso

on:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run distro-iso.yml --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "distro/**"
      - ".github/workflows/distro-iso.yml"
  push:
    branches: [main]
    paths:
      - "distro/**"
      - ".github/workflows/distro-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distro-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: build ISO, size, QEMU boot
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ENGINE: docker
      ISO_DIR: ${{ github.workspace }}/iso-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /

      - name: QEMU, OVMF and KVM access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: build-iso.sh helper reuse (fake engine, seconds)
        run: distro/tests/build-iso-helper.sh

      - name: Build the ISO (OS image, installer image, image-builder generic-iso, size check)
        env:
          VERSION: ${{ github.event_name == 'pull_request' && format('0.0.0-pr.{0}', github.event.pull_request.number) || format('0.0.0-ci.{0}', github.run_number) }}
        run: distro/scripts/build-iso.sh "$ISO_DIR"

      - name: Boot the ISO in QEMU/OVMF up to the installer (serial console)
        run: |
          iso="$(ls "$ISO_DIR"/*.iso)"
          distro/tests/iso-boot.sh "$iso" "$ISO_DIR/serial.log"

      - name: Summary
        if: always()
        run: |
          { echo '### Kinolune OS ISO'; echo '```'; cat "$ISO_DIR/iso-info.txt" 2>/dev/null || echo "no ISO"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iso-logs-${{ github.run_number }}
          path: |
            ${{ env.ISO_DIR }}/iso-info.txt
            ${{ env.ISO_DIR }}/serial.log
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: kinolune-os-iso-${{ github.run_number }}
          path: |
            ${{ env.ISO_DIR }}/*.iso
            ${{ env.ISO_DIR }}/*.iso.sha256
          retention-days: 7
          compression-level: 0
