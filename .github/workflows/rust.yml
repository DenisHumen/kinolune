# SPDX-License-Identifier: MPL-2.0
#
# Rust checks for the whole Cargo workspace: rustfmt, clippy and nextest.
# The toolchain comes from rust-toolchain.toml. The workflow is safe for PRs
# from forks: `pull_request` only, read-only token, no secrets, every
# third-party action pinned to a full commit SHA.
#
# `all-green` is the single required check for branch protection: it passes
# when every Rust job passed or was skipped because no Rust files changed.

name: Rust

on:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files via the API
    outputs:
      # Non-PR events (push to main, merge queue, manual) always run everything.
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/rustfmt.toml'
              - '**/.rustfmt.toml'
              - '**/clippy.toml'
              - '**/.clippy.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
              - '.github/workflows/rust.yml'
              - 'tools/ci/prebuilt.sh'
              # corpus data is checked by tests in these crates
              - 'tools/recognition-eval/**'
              - 'tools/crates/pa-eval/**'

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; PRs (forks included) only restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: nextest
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked --no-tests=pass
      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --all-features --locked --doc
      # CI-008: pa-player-io's real-library tests (ADR-0027) run against our
      # prebuilt LGPL FFmpeg + libmpv: actions/cache of this branch or main,
      # else the release `prebuilt`. Nothing is built here; a recipe change
      # that is not built yet only skips those tests.
      - name: Prebuilt libmpv key
        id: prebuilt
        run: echo "key=$(tools/ci/prebuilt.sh key libmpv linux-x86_64)" >> "$GITHUB_OUTPUT"
      - name: Prebuilt libmpv from actions/cache
        id: libcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mpv/out/linux-x86_64
          key: prebuilt-${{ steps.prebuilt.outputs.key }}
      - name: Prebuilt libmpv from the release, licence gate
        id: libs
        env:
          KEY: ${{ steps.prebuilt.outputs.key }}
          CACHE_HIT: ${{ steps.libcache.outputs.cache-hit }}
        run: |
          dir=tools/mpv/out/linux-x86_64
          if [ "$CACHE_HIT" = true ]; then src=actions/cache
          elif tools/ci/prebuilt.sh fetch "$KEY" "$dir"; then src="release prebuilt"
          else
            echo "::warning::$KEY is neither cached nor published: pa-player-io real-library tests are skipped"
            exit 0
          fi
          tools/mpv/check-license.sh --artifact "$dir"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libva2 libva-drm2 libdrm2 libegl1 libpulse0 libasound2t64
          echo "lib=$PWD/$dir/lib" >> "$GITHUB_OUTPUT"
          echo "pa-player-io: $KEY from $src" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pa-player-io against the prebuilt FFmpeg and libmpv
        if: steps.libs.outputs.lib != ''
        env:
          PA_PLAYER_IO_LIB_DIR: ${{ steps.libs.outputs.lib }}
          # The prebuilt libraries find each other here (no RUNPATH).
          LD_LIBRARY_PATH: ${{ steps.libs.outputs.lib }}
        run: cargo nextest run --locked -p pa-player-io
      # pa-secrets against a real Secret Service: a throwaway gnome-keyring
      # in its own D-Bus session (no desktop on the runner).
      - name: pa-secrets with Secret Service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus
          XDG_DATA_HOME="$(mktemp -d)" dbus-run-session -- sh -c 'echo test | gnome-keyring-daemon --unlock --components=secrets >/dev/null && PA_SECRETS_NATIVE_TEST=1 cargo test --locked -p pa-secrets --test native'

  # Crates whose behavior depends on the host OS (file systems, paths) also
  # run their tests on Windows and macOS. One `-p` per crate.
  test-os:
    name: tests (${{ matrix.os }})
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        # pa-secrets: also test the OS keychain (Keychain, Credential Manager).
        env:
          PA_SECRETS_NATIVE_TEST: "1"
        run: cargo test --locked -p pa-vfs -p pa-secrets -p pa-log

  all-green:
    name: all-green
    if: ${{ (always()) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [changes, fmt, clippy, test, test-os]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` must succeed, otherwise skipped jobs would hide a broken filter.
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi
          bad=$(echo "$NEEDS" | jq '[.[] | select(.result != "success" and .result != "skipped")] | length')
          if [ "$bad" -ne 0 ]; then
            echo "::error::Some Rust jobs failed or were cancelled"
            exit 1
          fi
