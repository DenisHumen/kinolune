# SPDX-License-Identifier: MPL-2.0
#
# LGPL-2.1+ libsmb2 for every client target (NET-002). Builds
# tools/libsmb2/build.sh as a shared library for Linux, Windows, Android
# (3 ABIs) and Apple (macOS dylib; iOS and tvOS embedded frameworks incl.
# simulators, plus one smb2.xcframework), runs the licence and linkage gate
# on every artifact and uploads the result; release-app.yml calls it to bundle
# libsmb2 into the app (LIB-019). libsmb2 builds in about a minute,
# so only the source tarball is cached.
name: libsmb2 (LGPL)

on:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "tools/libsmb2/**"
      - ".github/workflows/libsmb2.yml"
      # The live check on Windows (job windows-smb, UI-029).
      - "core/crates/pa-smb2/**"
      - "core/crates/pa-vfs-smb/**"
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only Windows x86_64 (and the sources), then the live SMB check on Windows
        type: boolean
        default: false
  # release-app.yml (LIB-019): the app bundles these artifacts. `release`
  # builds only what the app ships (Linux x86_64, Windows x86_64, Android
  # ABIs, macOS arm64 and x86_64, sources); `apple_only` skips Linux, Windows
  # and Android (macOS-only dry runs of the app, PKG-019); `windows_only`
  # builds only Windows x86_64 and the sources (Windows-only dry runs, PKG-020).
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      apple_only:
        type: boolean
        default: false
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # As a called workflow, github.workflow is the caller's name: no clash.
  group: libsmb2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_NDK_PACKAGE: "ndk;28.2.13676358" # r28c

jobs:
  sources:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Sources and static-build canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache source tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/libsmb2/.cache
          key: libsmb2-src-${{ hashFiles('tools/libsmb2/versions.sh') }}
      - name: Download and verify pinned source
        run: tools/libsmb2/build.sh fetch
      - name: A static build must fail
        run: |
          for flag in -DBUILD_SHARED_LIBS=OFF -DENABLE_LIBKRB5=ON; do
            if out="$(PA_SMB2_EXTRA_FLAGS="$flag" tools/libsmb2/build.sh linux-x86_64 2>&1)"; then
              echo "::error::build accepted $flag"; exit 1
            fi
            printf '%s\n' "$out" | grep -q 'forbidden libsmb2 option' \
              || { printf '%s\n' "$out"; echo "::error::$flag failed for the wrong reason"; exit 1; }
            echo "rejected: $flag"
          done
      - name: Licence gate rejects a static CMakeCache
        run: |
          d="$RUNNER_TEMP/fake-static"; mkdir -p "$d"
          printf '%s\n' 'BUILD_SHARED_LIBS:BOOL=OFF' 'ENABLE_LIBKRB5:BOOL=OFF' 'ENABLE_GSSAPI:BOOL=OFF' > "$d/CMakeCache.txt"
          if tools/libsmb2/check-license.sh --config "$d"; then echo "::error::static CMakeCache passed"; exit 1; fi
      - name: Corresponding-source bundle
        run: tools/libsmb2/build.sh sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsmb2-sources
          path: tools/libsmb2/out/project_alpha-libsmb2-sources-*.tar.xz
          retention-days: 7
          if-no-files-found: error

  docker:
    if: ${{ !inputs.apple_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.target }}
    needs: sources
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.windows_only && '["windows-x86_64"]' || '["linux-x86_64","windows-x86_64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore source tarball
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/libsmb2/.cache
          key: libsmb2-src-${{ hashFiles('tools/libsmb2/versions.sh') }}
          fail-on-cache-miss: true
      # The gate runs inside the image as part of the build (ldd + check_smb2
      # for Linux, objdump of the DLL for Windows).
      - name: Build and check
        run: PA_SMB2_JOBS="$(nproc)" tools/libsmb2/docker-build.sh "${TARGET}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsmb2-${{ matrix.target }}
          path: tools/libsmb2/out/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  android:
    if: ${{ !inputs.apple_only && !inputs.windows_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.target }}
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64-v8a, android-armeabi-v7a, android-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore source tarball
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/libsmb2/.cache
          key: libsmb2-src-${{ hashFiles('tools/libsmb2/versions.sh') }}
          fail-on-cache-miss: true
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build cmake
          # sdkmanager verifies the package checksum from Google's repository.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_NDK_PACKAGE" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/${ANDROID_NDK_PACKAGE/;//}" >> "$GITHUB_ENV"
      - name: Build and check
        run: PA_SMB2_JOBS="$(nproc)" tools/libsmb2/build.sh "${{ matrix.target }}"
      - name: Android packaging check (SONAME, NEEDED, 16 KB pages)
        run: tools/libsmb2/bundle.sh check-android "tools/libsmb2/out/${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsmb2-${{ matrix.target }}
          path: tools/libsmb2/out/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  apple:
    # Release builds need only the macOS dylibs (PKG-019).
    if: ${{ !inputs.windows_only && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: apple
    needs: sources
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore source tarball
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/libsmb2/.cache
          key: libsmb2-src-${{ hashFiles('tools/libsmb2/versions.sh') }}
          fail-on-cache-miss: true
      - name: Install toolchain
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          cmake --version
          xcodebuild -version
      # Sequential in one job: each slice takes well under a minute, and the
      # XCFramework needs all of them. macos-arm64 also runs check_smb2.
      - name: Build and check
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          targets="macos-arm64 macos-x86_64 ios-arm64 ios-sim-arm64 tvos-arm64 tvos-sim-arm64"
          [ "$RELEASE" = true ] && targets="macos-arm64 macos-x86_64"
          for t in $targets; do
            PA_SMB2_JOBS="$(sysctl -n hw.ncpu)" tools/libsmb2/build.sh "$t"
          done
          [ "$RELEASE" = true ] || tools/libsmb2/build.sh xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsmb2-apple
          path: tools/libsmb2/out
          retention-days: 7
          if-no-files-found: error

  windows-smb:
    # UI-029: the Windows DLL really talks SMB. The runner's own SMB server
    # gets a local account and a share; pa-smb2 and pa-vfs-smb (built for
    # x86_64-pc-windows-msvc, as in the app) then list the shares, browse,
    # read bytes and classify a wrong password and a missing share, by
    # 127.0.0.1, localhost (IPv6) and the host name. Not in release runs.
    if: ${{ !inputs.apple_only && !inputs.release && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Windows SMB (live server)
    needs: docker
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsmb2-windows-x86_64
          path: ${{ runner.temp }}/libsmb2
      - name: Local account and share on the runner's SMB server
        run: |
          $ErrorActionPreference = 'Stop'
          # A throw-away password for a throw-away account on a throw-away VM.
          $pass = 'Kl-' + [guid]::NewGuid().ToString('N').Substring(0, 20) + '!9a'
          Write-Output "::add-mask::$pass"
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name kinotest -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member kinotest
          $dir = Join-Path $env:RUNNER_TEMP 'smbshare'
          $films = Join-Path $dir 'Фильмы'
          New-Item -ItemType Directory -Force -Path $films | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'hello.txt'), [Text.Encoding]::ASCII.GetBytes('kinolune-smb-ok'))
          $b = [byte[]]::new(256 * 4096)
          for ($i = 0; $i -lt $b.Length; $i++) { $b[$i] = $i % 256 }
          [IO.File]::WriteAllBytes((Join-Path $films 'sample.bin'), $b)
          icacls $dir /grant 'kinotest:(OI)(CI)R' | Out-Null
          New-SmbShare -Name kinotest -Path $dir -ReadAccess kinotest | Out-Null
          Get-Service LanmanServer | Format-Table Name, Status
          Get-SmbServerConfiguration | Format-List EnableSMB2Protocol, RequireSecuritySignature, EncryptData, RejectUnencryptedAccess
          Get-SmbShare | Format-Table Name, Path
          "PA_SMB_LIVE_PASS=$pass" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PA_SMB_LIVE_SERVERS=127.0.0.1,localhost,$env:COMPUTERNAME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install; rustup show active-toolchain
      - name: pa-smb2 and pa-vfs-smb against the live server
        env:
          PA_SMB2_LIB: ${{ runner.temp }}\libsmb2\bin\libsmb2.dll
          PA_SMB_LIVE_USER: kinotest
          PA_SMB_LIVE_SHARE: kinotest
        run: cargo test --locked -p pa-smb2 -p pa-vfs-smb --tests -- --nocapture --test-threads 1
