# containers-storage of the live installer (DIST-007).
# image-builder puts the OS image (payload) into /var/lib/containers/storage of the
# squashfs, but the live root is an overlayfs on top of it: overlay layers of podman
# break when their lower directories are seen through another overlayfs (whiteouts and
# opaque directories are eaten by it). So the payload is read from the squashfs itself
# (dmsquash-live mounts it at /run/rootfsbase, also with rd.live.ram=1) as a read-only
# image store, and the writable graph root lives in RAM (only container scratch layers).
# Sorts after 00-vendor-rootful.conf, so these values win.
[storage]
graphroot = "/run/alpha-live/containers/storage"

[storage.options]
additionalimagestores = ["/run/rootfsbase/var/lib/containers/storage", "/usr/lib/containers/storage"]
