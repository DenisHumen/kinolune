# SPDX-License-Identifier: MPL-2.0
# Initramfs of the Kinolune OS installer ISO (DIST-007): boots /LiveOS/squashfs.img found
# by the ISO label (root=live:CDLABEL=…, added by image-builder). zstd: small and fast to
# unpack; microcode is loaded by the installed system, not by the installer.
compress="zstd"
add_dracutmodules+=" dmsquash-live "
early_microcode="no"
hostonly="no"
