# SPDX-License-Identifier: MPL-2.0
# ISO settings read by image-builder (generic-iso), DIST-007.
# label: ISO 9660 volume label (<= 32 chars; ${root} becomes root=live:CDLABEL=<label>).
# Kernel messages go to both consoles, tty0 is the main one (/dev/console) for a monitor;
# the installer also runs on ttyS0 for headless boxes and the QEMU smoke test.
label: "Kinolune-OS-Installer"
kernel_args:
  - console=ttyS0,115200
  - console=tty0
  - loglevel=3
  - systemd.show_status=error
grub2:
  timeout: 5
  entries:
    - name: "Install Kinolune OS"
      linux: ${kernelpath} ${root}
      initrd: ${initrdpath}
    - name: "Install Kinolune OS (basic graphics)"
      linux: ${kernelpath} ${root} nomodeset
      initrd: ${initrdpath}
    - name: "Install Kinolune OS (copy to RAM, the USB stick can be removed)"
      linux: ${kernelpath} ${root} rd.live.ram=1
      initrd: ${initrdpath}
