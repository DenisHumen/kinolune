# bootc does not deliver /var from the image, so state directories are created at boot.
d /var/srv 0755 root root -
# Shares (DIST-018): Media is shared by the NAS users (setgid, group
# alpha-users); Users/<name> and TimeMachine/<name> are created per user by
# alpha-admin-priv. The SELinux type samba_share_t comes from
# /etc/selinux/targeted/contexts/files/file_contexts.local; tmpfiles fixes
# mode, owner and label of these top directories at every boot.
d /var/srv/media 2775 root alpha-users -
d /var/srv/users 0755 root root -
d /var/srv/timemachine 0755 root root -
d /var/lib/alpha 0755 root root -
d /var/lib/alpha/samba 0755 root root -
d /var/lib/samba/drivers 0775 root printadmin -
