# Samba of Kinolune OS (DIST-018, ADR-NNNN). Static part; the guest policy
# and the shares (Media, Users, TimeMachine) are generated by alpha-admin-priv
# into /etc/samba/smb.conf.d/kinolune.conf from the settings of the admin UI
# at every boot and on every change. Edit the settings in the admin UI, not
# the generated file.
[global]
    workgroup = WORKGROUP
    server string = Kinolune OS (%h)
    server role = standalone server
    security = user
    passdb backend = tdbsam
    server min protocol = SMB3
    # SMB on 445 only: no NetBIOS (Windows finds the NAS through wsdd,
    # macOS and Linux through Avahi/mDNS).
    disable netbios = yes
    smb ports = 445
    # Announce _smb._tcp and, with Time Machine, _adisk._tcp over Avahi.
    multicast dns register = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    # macOS: Finder metadata, resource forks, Time Machine.
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:nfs_aces = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes
    # Generated part (continues [global], then the shares). Keep it last.
    include = /etc/samba/smb.conf.d/kinolune.conf
