# SPDX-License-Identifier: MPL-2.0
name: kinolune
description: "Kinolune: open-source media player for your own library (release 0.1)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Deps must be MIT/BSD/Apache/MPL (docs/dev/release-0.1-contract.md).
# Demo mode (--dart-define=KINOLUNE_DEMO=true) swaps pa_library for
# lib/fakes/fake_library.dart; everything else uses the real packages.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pa_core:
    path: ../packages/pa_core
  pa_library:
    path: ../packages/pa_library
  pa_platform_secrets:
    path: ../packages/pa_platform_secrets
  pa_player:
    path: ../packages/pa_player
  pa_design:
    path: ../../../design/flutter/pa_design
  # NET-019: Wi-Fi or mobile data for "Wi-Fi only" downloads (BSD-3-Clause).
  connectivity_plus: ^7.3.2
  file_picker: ^13.3.3
  # TWI-009: local "X is live" notifications (BSD-3-Clause).
  flutter_local_notifications: ^23.0.2
  flutter_svg: ^2.0.0
  flutter_secure_storage: ^11.2.0
  # UI-019: QR scanning with ZXing C++ (MIT/Apache-2.0), no Google services.
  flutter_zxing: ^3.1.1
  intl: ^0.20.2
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr: ^4.0.1
  # TWI-005: "Open on Twitch" on phones and desktops, links (BSD-3-Clause).
  url_launcher: ^6.3.3
  # TWI-005: the official Twitch embed in a WebView on Android, iOS and
  # macOS (BSD-3-Clause; no Linux/Windows implementation: browser there).
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  # TWI-009: the Android background check of "X is live" (MIT).
  workmanager: ^0.10.10

# PLAY-013: our LGPL-2.1 libmpv (tools/mpv) instead of the prebuilt LGPL-3.0
# jars that upstream media_kit_libs_android_video downloads. Same Java glue.
dependency_overrides:
  media_kit_libs_android_video:
    path: ../packages/media_kit_libs_android_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests open the host libpa_frb by path (test/support/native_library.dart).
  flutter_rust_bridge: 2.13.0

flutter:
  uses-material-design: true
  # gen-l10n (UI-020): lib/l10n/*.arb -> lib/l10n/app_localizations*.dart,
  # see l10n.yaml. The generated Dart files are not committed.
  generate: true
  # Copies of design/brand/src/mark.svg, wordmark.svg and design/placeholders/export
  # (DSN-006); refresh them when the brand changes.
  assets:
    - assets/brand/
    - assets/placeholders/
