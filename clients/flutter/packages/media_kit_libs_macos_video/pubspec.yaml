# SPDX-License-Identifier: MPL-2.0
#
# Our own macOS counterpart of media_kit_libs_macos_video (PKG-019). The app
# depends on it by path. media_kit_video's podspec looks for a package with
# exactly this name in pubspec.lock and then links `-framework Mpv` from
# macos/Frameworks/.symlinks/mpv/macos; this package provides that framework
# and the FFmpeg frameworks from our LGPL-2.1 libmpv build (tools/mpv)
# instead of the prebuilt libmpv-darwin-build archive upstream downloads.
name: media_kit_libs_macos_video
description: "Kinolune: media_kit macOS native libraries from our own LGPL-2.1 libmpv build (tools/mpv)."
version: 1.1.4
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MediaKitLibsMacosVideoPlugin
