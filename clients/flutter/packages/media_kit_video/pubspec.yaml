# Local copy of media_kit_video 2.0.1 (MIT, see LICENSE) used by the app
# through dependency_overrides (BUG-001). Unchanged except
# linux/texture_gl.cc: Flutter's texture of a closed video is freed on the
# raster thread, so the last frame of every closed player no longer stays in
# memory. Drop the copy once upstream frees it (media-kit/media-kit).
name: media_kit_video
description: "Kinolune: media_kit_video 2.0.1 with the Linux texture freed on close (BUG-001)."
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 2.0.1
topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.3

  synchronized: ^3.1.0
  wakelock_plus: ^1.1.6
  universal_platform: ^1.0.0+1
  plugin_platform_interface: ^2.0.2
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0



flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitVideoPluginCApi
      linux:
        pluginClass: MediaKitVideoPlugin
      macos:
        pluginClass: MediaKitVideoPlugin
      ios:
        pluginClass: MediaKitVideoPlugin
      android:
        package: com.alexmercerind.media_kit_video
        pluginClass: MediaKitVideoPlugin
      web:
