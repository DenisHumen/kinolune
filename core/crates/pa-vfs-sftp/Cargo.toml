# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-vfs-sftp"
version = "0.1.0"
description = "SFTP backend of pa-vfs: russh + russh-sftp, host key pinned on first use (TOFU), password, keyboard-interactive and key auth, pipelined positional reads (NET-006)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Contract tests against OpenSSH in Docker (tests/servers/README.md).
# Off by default: they need the container to be running.
server-tests = []

[dependencies]
futures-util.workspace = true
pa-vfs = { path = "../pa-vfs" }
# Pure-Rust SSH with the ring backend: no OpenSSL, no aws-lc (deny.toml,
# cross-builds for Android and iOS without cmake).
russh.workspace = true
russh-sftp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync"] }
