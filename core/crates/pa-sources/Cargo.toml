pa-sync = { path = "../pa-sync" }
pa-vfs = { path = "../pa-vfs" }
pa-vfs-smb = { path = "../pa-vfs-smb" }
pa-vfs-webdav = { path = "../pa-vfs-webdav" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
