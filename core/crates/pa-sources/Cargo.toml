# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-sources"
version = "0.1.0"
description = "Source manager: local, SMB, WebDAV, SFTP, FTP, Jellyfin, Emby, Plex, Subsonic, DLNA and playlist sources in the library database, passwords in the OS secret store, status, connection check and speed test (NET-011), sync of the source list with E2E-sealed passwords (SYNC-010)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# UI-028 browse tests against Samba in Docker (tests/smb_server/run.sh).
server-tests = []

[dependencies]
pa-cloud = { path = "../pa-cloud" }
pa-dlna = { path = "../pa-dlna" }
pa-jellyfin = { path = "../pa-jellyfin" }
pa-lan-probe = { path = "../pa-lan-probe" }
pa-library = { path = "../pa-library" }
pa-plex = { path = "../pa-plex" }
pa-secrets = { path = "../pa-secrets" }
pa-subsonic = { path = "../pa-subsonic" }
pa-sync = { path = "../pa-sync" }
pa-vfs = { path = "../pa-vfs" }
pa-vfs-ftp = { path = "../pa-vfs-ftp" }
pa-vfs-http = { path = "../pa-vfs-http" }
pa-vfs-sftp = { path = "../pa-vfs-sftp" }
pa-vfs-smb = { path = "../pa-vfs-smb" }
pa-vfs-webdav = { path = "../pa-vfs-webdav" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
pa-model = { path = "../pa-model" }
tempfile.workspace = true
