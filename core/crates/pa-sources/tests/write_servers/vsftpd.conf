#
# vsftpd for the NET-023 write contract: local user chrooted to /data,
# writes allowed (/data/ro is a read-only mount). The start.sh of the
# pa-vfs-ftp suite appends the port and the passive range.

listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/data
secure_chroot_dir=/var/empty
seccomp_sandbox=NO
pasv_enable=YES
port_enable=NO
max_clients=0
max_per_ip=0
xferlog_enable=NO
