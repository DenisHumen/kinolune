#
# Samba for the NET-023 write contract: a writable share and a read-only
# one; only the throwaway user may log on.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   passdb backend = tdbsam
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2_02
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix charset = UTF-8
   log level = 1

[rw]
   path = /data/smb
   read only = no
   valid users = kinolune
   create mask = 0664
   directory mask = 0775

[ro]
   path = /ro
   read only = yes
   valid users = kinolune
