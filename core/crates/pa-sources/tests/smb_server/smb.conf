#
# Samba for the UI-028 browse tests: a home server set up the way people
# do it at home. `alex` keeps films in ~/smb_shared/torrents/downloads and
# reaches them through the per-user home share and through a share that
# points deep into the home folder.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   passdb backend = tdbsam
   map to guest = bad user
   restrict anonymous = 0
   server min protocol = SMB2_02
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix charset = UTF-8
   log level = 1

# Each user's home folder as a share named after the user; not listed.
[homes]
   browseable = no
   read only = yes
   valid users = %S

# A share that points inside alex's home folder.
[smb_shared]
   path = /home/alex/smb_shared
   read only = yes
   valid users = alex

# Open to everyone, guests included.
[public]
   path = /srv/public
   read only = yes
   guest ok = yes

# Only bob may open it.
[private]
   path = /srv/private
   read only = yes
   valid users = bob
