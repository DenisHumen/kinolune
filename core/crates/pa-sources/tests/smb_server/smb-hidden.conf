#
# Samba for the UI-031 browse tests: a server that lets `alex` log in but
# does not tell its shares, like the owner's box (there srvsvc drops the
# share enumeration; here IPC$ is closed to everyone, the same answer to
# the app: login fine, no list). No `[homes]`; the films are in a share
# named `shared` that points into alex's home folder, a name nobody can
# guess from the disk path /home/alex/smb_shared/torrents/downloads.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   passdb backend = tdbsam
   map to guest = bad user
   restrict anonymous = 0
   server min protocol = SMB2_02
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix charset = UTF-8
   log level = 1

# No share list for anyone.
[IPC$]
   hosts deny = 0.0.0.0/0

[shared]
   path = /home/alex/smb_shared
   read only = yes
   valid users = alex
