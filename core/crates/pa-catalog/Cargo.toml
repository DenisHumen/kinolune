# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-catalog"
version = "0.1.0"
description = "Client media library on the Rust core: scan pipeline (pa-scanner, music tags, fingerprints, local recognition with pa-recognition), provider metadata (pa-metadata), item views, progress and the pa_library v0 import (UI-024), change watcher (LIB-005), sources through pa-vfs connectors and the playback opener (LIB-018)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tests against Samba, WebDAV, OpenSSH and vsftpd in Docker (tests/servers/run.sh)
# and the large-library benchmark (tests/large_library/run.sh, LIB-023).
server-tests = []

[dependencies]
jpeg-encoder.workspace = true
md4.workspace = true
notify.workspace = true
pa-anime-mappings = { path = "../pa-anime-mappings" }
pa-jobs = { path = "../pa-jobs" }
pa-library = { path = "../pa-library" }
pa-metadata = { path = "../pa-metadata" }
pa-model = { path = "../pa-model" }
pa-probe = { path = "../pa-probe" }
pa-proxy = { path = "../pa-proxy" }
pa-recognition = { path = "../pa-recognition" }
pa-scanner = { path = "../pa-scanner" }
pa-secrets = { path = "../pa-secrets" }
pa-sources = { path = "../pa-sources" }
pa-sync = { path = "../pa-sync" }
pa-vfs = { path = "../pa-vfs" }
# `.strm` links (NET-018).
pa-vfs-http = { path = "../pa-vfs-http" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pa-discovery = { path = "../pa-discovery" }
pa-imagecache = { path = "../pa-imagecache", default-features = false }
pa-sync = { path = "../pa-sync", features = ["lan"] }
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
