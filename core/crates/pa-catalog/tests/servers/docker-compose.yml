# SPDX-License-Identifier: MPL-2.0
#
# Samba, WebDAV, OpenSSH and vsftpd (explicit FTPS) for the LIB-018 and
# NET-006 end-to-end tests: the catalog scans and streams each through
# pa-sources. Reuses the server configs of the NET-003/NET-004/NET-006
# contract suites. Started by run.sh, which seeds
# $PA_SERVERS_DATA and $PA_SERVERS_AUTH first. Ports are bound to 127.0.0.1
# only; bind mounts only, no named volumes.

services:
  samba:
    image: alpine:3.22
    command: [sh, /etc/pa/start.sh]
    volumes:
      - ../../../pa-vfs-smb/tests/servers/smb.conf:/etc/pa/smb.conf:ro
      - ../../../pa-vfs-smb/tests/servers/start.sh:/etc/pa/start.sh:ro
      - ${PA_SERVERS_DATA}:/data:ro
    environment:
      PA_SMB_USER: ${PA_SERVERS_USER}
      PA_SMB_PASS: ${PA_SERVERS_PASS}
    ports:
      - 127.0.0.1:18545:445

  webdav:
    image: alpine:3.22
    command:
      - sh
      - -c
      - apk add --no-cache nginx nginx-mod-http-dav-ext >/dev/null && exec nginx -c /etc/pa/nginx.conf -g 'daemon off;'
    volumes:
      - ../../../pa-vfs-webdav/tests/servers/nginx.conf:/etc/pa/nginx.conf:ro
      - ${PA_SERVERS_DATA}:/data:ro
      - ${PA_SERVERS_AUTH}:/auth:ro
    ports:
      - 127.0.0.1:18581:8080

  sftp:
    image: alpine:3.22
    init: true
    command: [sh, /etc/pa/start.sh]
    environment:
      PA_SFTP_USER: ${PA_SERVERS_USER}
      PA_SFTP_PASS: ${PA_SERVERS_PASS}
      PA_SFTP_KEY_PASS: unused
    volumes:
      - ../../../pa-vfs-sftp/tests/servers/sshd_config:/etc/pa/sshd_config:ro
      - ../../../pa-vfs-sftp/tests/servers/start.sh:/etc/pa/start.sh:ro
      - ${PA_SERVERS_DATA}:/data:ro
      - ${PA_SERVERS_KEYS}:/keys
    ports:
      - 127.0.0.1:18522:2222

  ftp:
    image: alpine:3.22
    init: true
    command: [sh, /etc/pa/start.sh]
    environment:
      PA_FTP_USER: ${PA_SERVERS_USER}
      PA_FTP_PASS: ${PA_SERVERS_PASS}
      PA_FTP_MODE: explicit
      PA_FTP_PASV: 18830-18869
    volumes:
      - ../../../pa-vfs-ftp/tests/servers/vsftpd.conf:/etc/pa/vsftpd.conf:ro
      - ../../../pa-vfs-ftp/tests/servers/start.sh:/etc/pa/start.sh:ro
      - ${PA_SERVERS_DATA}:/data:ro
      - ${PA_SERVERS_CERTS}:/certs:ro
    ports:
      - 127.0.0.1:18521:2121
      - 127.0.0.1:18830-18869:18830-18869
