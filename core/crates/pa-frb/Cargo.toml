# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-frb"
version = "0.1.0"
description = "flutter_rust_bridge facade of the project_alpha core for the Dart package pa_core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pa_frb"
# cdylib: Android, Linux, Windows; staticlib: Apple; lib: Rust tests.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Build flavor (ADR-0007, CORE-013): exactly one of them in release builds;
# neither means `store`. See docs/dev/flavors.md.
store = ["pa-flavor/store"]
full = ["pa-flavor/full"]

[dependencies]
flutter_rust_bridge.workspace = true
pa-catalog = { path = "../pa-catalog" }
pa-discovery = { path = "../pa-discovery" }
pa-ffi = { path = "../pa-ffi" }
pa-flavor = { path = "../pa-flavor" }
pa-imagecache = { path = "../pa-imagecache" }
pa-jobs = { path = "../pa-jobs" }
pa-library = { path = "../pa-library" }
# CORE-008: opt-in logs, crash reports, the diagnostic report.
pa-log = { path = "../pa-log" }
pa-model = { path = "../pa-model" }
# NET-019: offline copies of library items.
pa-offline = { path = "../pa-offline" }
pa-proxy = { path = "../pa-proxy" }
pa-recognition = { path = "../pa-recognition" }
pa-remote-config = { path = "../pa-remote-config" }
# CORE-009: the event bus and error codes.
pa-runtime = { path = "../pa-runtime" }
pa-probe = { path = "../pa-probe" }
pa-secrets = { path = "../pa-secrets" }
# MUS-015: Last.fm and ListenBrainz scrobbling of music.
pa-scrobble = { path = "../pa-scrobble" }
pa-skip = { path = "../pa-skip" }
pa-sources = { path = "../pa-sources" }
pa-storage = { path = "../pa-storage" }
pa-sync = { path = "../pa-sync", features = ["lan"] }
# UI-036: which trailer a movie or show page plays.
pa-trailers = { path = "../pa-trailers" }
# SYNC-011: Trakt sign-in, scrobbles, history, watchlist and ratings.
pa-trakt = { path = "../pa-trakt" }
pa-trickplay = { path = "../pa-trickplay" }
# PKG-018: checks of in-app update downloads (SHA256SUMS, minisign).
pa-update = { path = "../pa-update" }
# TWI-013: the Twitch section (Helix, sign-in, library model).
pa-twitch = { path = "../pa-twitch", features = ["library"] }
# TWI-017: VOD downloads (an empty library in store builds).
pa-twitch-archive = { path = "../pa-twitch-archive" }
pa-twitch-chat = { path = "../pa-twitch-chat" }
# TWI-009: "X is live" (EventSub + polling), timelines in the library.
pa-twitch-live = { path = "../pa-twitch-live", features = ["library"] }
pa-vfs = { path = "../pa-vfs" }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
# NET-024: endpoint addresses of the availability monitor.
url.workspace = true

[build-dependencies]
pa-flavor = { path = "../pa-flavor" }

[dev-dependencies]
pa-twitch = { path = "../pa-twitch", features = ["library", "testing"] }
tempfile.workspace = true

[lints.rust]
# Emitted by the flutter_rust_bridge macros.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
