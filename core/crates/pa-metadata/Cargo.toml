# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-metadata"
version = "0.1.0"
description = "Metadata provider clients outside the sans-IO core: TMDB, AniList, Shikimori, MusicBrainz, Cover Art Archive, Open Library, trace.moe, OpenSubtitles, Subdl, TVmaze, TheTVDB, Fanart.tv, rate limiting, ProviderCache (META-009, META-010, META-012, META-021, META-031, PLAY-008, PLAY-016, MUS-019)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["http"]
# Live HTTPS transport (ureq + rustls/ring + webpki-roots). Without it the
# crate still builds with any injected `HttpTransport` (tests, replay).
http = ["dep:ureq"]

[dependencies]
# Raw deflate of subtitle ZIP archives (Subdl, PLAY-016); already in the tree.
flate2.workspace = true
pa-recognition = { path = "../pa-recognition" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
