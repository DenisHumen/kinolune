# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-jellyfin"
version = "0.1.0"
description = "Jellyfin client (NET-014): sign-in (password, Quick Connect), users, libraries, Continue Watching, favorites, secondary addresses, playback reports, DirectPlay/DirectStream/HLS transcode, trickplay, and the server's libraries as a read-only pa-vfs tree"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tests against Jellyfin in Docker (tests/server/run.sh).
server-tests = []

[dependencies]
pa-vfs = { path = "../pa-vfs" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Blocking HTTP (ADR-0013: pa-vfs is synchronous), rustls with ring and the
# Mozilla roots, no OpenSSL (deny.toml); already used by pa-metadata.
ureq.workspace = true

[dev-dependencies]
pa-trickplay = { path = "../pa-trickplay" }
