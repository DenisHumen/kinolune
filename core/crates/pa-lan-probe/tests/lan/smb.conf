# NET-010 test share (guest, read-only).
[global]
   workgroup = KINOTEST
   netbios name = KINO-WINPC
   server string = Kinolune test share
   map to guest = Bad User
   disable spoolss = yes
   load printers = no
   local master = yes
   preferred master = yes
   os level = 65

[media]
   path = /srv/media
   read only = yes
   guest ok = yes
