# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-lan-probe"
version = "0.1.0"
description = "LAN discovery beyond mDNS and SSDP (NET-010): Windows shares over WS-Discovery and NetBIOS name service, Plex over GDM and Jellyfin/Emby over their UDP auto-discovery"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tests against Samba + wsdd and Jellyfin in Docker (tests/lan/run.sh).
server-tests = []

[dependencies]
# Local IPv4 addresses, netmasks and broadcast addresses to probe from.
if-addrs.workspace = true
# WS-Discovery metadata (`Get`) over HTTP to the device's own address.
pa-vfs-http = { path = "../pa-vfs-http" }
quick-xml.workspace = true
serde_json.workspace = true
# Multicast interface and broadcast permission of the probe sockets.
socket2.workspace = true
url.workspace = true

