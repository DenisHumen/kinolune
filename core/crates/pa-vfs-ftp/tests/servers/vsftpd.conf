# SPDX-License-Identifier: MPL-2.0
#
# vsftpd for the pa-vfs-ftp contract suite (NET-006): local users only,
# read-only, chrooted to the fixture mount, passive mode. start.sh appends
# the port, the passive range and the TLS lines of each service.

listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=NO
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/data
secure_chroot_dir=/var/empty
seccomp_sandbox=NO
# Names go out as stored (UTF-8 on the fixture); this build has no
# utf8_filesystem option.
pasv_enable=YES
port_enable=NO
max_clients=0
max_per_ip=0
xferlog_enable=NO
