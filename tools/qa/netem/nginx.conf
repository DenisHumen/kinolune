# QA-007: serve the test films from /media with Range support.
worker_processes 1;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    sendfile on;
    default_type application/octet-stream;
    server {
        listen 8080;
        root /media;
    }
}
