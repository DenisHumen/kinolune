# QA-016 e2e stand: a read-only media share and a writable scratch share,
# both for the throwaway test user only (no guest access).
[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = KINOLUNE-E2E
   server string = Kinolune e2e stand
   map to guest = Never
   server min protocol = SMB2_10
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[media]
   comment = Test library (read-only)
   path = /srv/media
   read only = yes
   browseable = yes
   valid users = @e2e

[scratch]
   comment = Scratch (read-write)
   path = /srv/scratch
   read only = no
   browseable = yes
   valid users = @e2e
   create mask = 0664
   directory mask = 0775
