# SPDX-License-Identifier: MPL-2.0
#
# .deb and .rpm of Kinolune (PKG-002, PKG-023). build-packages.sh fills in
# ${PA_PKG_STAGE} (the staged tree), ${PA_PKG_ARCH} (amd64 or arm64, from the
# bundle; nfpm writes x86_64/aarch64 into the rpm, PKG-026) and
# ${PA_PKG_VERSION} (semver version;
# nfpm turns a pre-release into 0.1.0~alpha.7 for both formats, so
# alpha < beta < rc < the release in apt and dnf).
#
# Dependencies follow the bundle's NEEDED libraries outside the bundle
# (libmpv, FFmpeg and libsmb2 are inside): glibc 2.39, libstdc++ (GCC 13),
# GTK 3, libva, EGL + GLES 2 (the Flutter engine opens libGLESv2 at run
# time), PulseAudio client (works on PipeWire), ALSA, libsecret,
# Wayland. The rpm requires sonames, so it fits Fedora and openSUSE alike.
name: kinolune
arch: ${PA_PKG_ARCH}
platform: linux
version: ${PA_PKG_VERSION}
version_schema: semver
release: "1"
section: video
priority: optional
maintainer: Kinolune project <kinolune@users.noreply.github.com>
vendor: Kinolune
homepage: https://github.com/DenisHumen/kinolune
license: MPL-2.0 AND LGPL-2.1-or-later
description: |-
  Media player for your local and network library.
  Films, series, music and streams from local folders, SMB/NFS/WebDAV
  shares and media servers. libmpv, FFmpeg and libsmb2 (LGPL) are bundled.

contents:
  - src: ${PA_PKG_STAGE}/opt/kinolune
    dst: /opt/kinolune
    type: tree
  - src: /opt/kinolune/kinolune
    dst: /usr/bin/kinolune
    type: symlink
  - src: ${PA_PKG_STAGE}/app.kinolune.desktop
    dst: /usr/share/applications/app.kinolune.desktop
  - src: ${PA_PKG_STAGE}/app.kinolune.svg
    dst: /usr/share/icons/hicolor/scalable/apps/app.kinolune.svg
  # Repository key: postinstall copies it to /etc/apt/keyrings (binary) or
  # points the .repo file at it (armored).
  - src: ${PA_PKG_STAGE}/kinolune.gpg
    dst: /usr/share/kinolune/kinolune.gpg
  - src: ${PA_PKG_STAGE}/kinolune.asc
    dst: /usr/share/kinolune/kinolune.asc
  # In-app updates read this and only suggest apt/dnf (ADR-0109, UpdateKind.linuxPackage).
  - src: ${PA_PKG_STAGE}/package-type.deb
    dst: /opt/kinolune/package-type
    packager: deb
  - src: ${PA_PKG_STAGE}/package-type.rpm
    dst: /opt/kinolune/package-type
    packager: rpm

overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libstdc++6 (>= 13)
      - libgcc-s1
      - libgtk-3-0t64 | libgtk-3-0
      - libasound2t64 | libasound2
      - libsecret-1-0
      - libva2
      - libva-drm2
      - libdrm2
      - libegl1
      - libgles2
      - libepoxy0
      - libpulse0
      - libwayland-client0
      - libwayland-egl1
      - zlib1g
    recommends:
      - libegl-mesa0
      - pipewire-pulse | pulseaudio
    scripts:
      postinstall: ${PA_PKG_STAGE}/scripts/deb-postinst
      postremove: ${PA_PKG_STAGE}/scripts/deb-postrm
  rpm:
    depends:
      - libc.so.6(GLIBC_2.39)(64bit)
      - libstdc++.so.6(GLIBCXX_3.4.31)(64bit)
      - libgtk-3.so.0()(64bit)
      - libasound.so.2()(64bit)
      - libsecret-1.so.0()(64bit)
      - libva.so.2()(64bit)
      - libva-drm.so.2()(64bit)
      - libdrm.so.2()(64bit)
      - libEGL.so.1()(64bit)
      - libGLESv2.so.2()(64bit)
      - libepoxy.so.0()(64bit)
      - libpulse.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libz.so.1()(64bit)
    scripts:
      postinstall: ${PA_PKG_STAGE}/scripts/rpm-post
      postremove: ${PA_PKG_STAGE}/scripts/rpm-postun

rpm:
  group: Applications/Multimedia
  summary: Media player for your local and network library
  compression: zstd
deb:
  compression: zstd
